<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PTZLite</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="manifest" href="/manifest.json">
  <script type="module">
    import { VideoRTC } from '/video-rtc.js';
    customElements.define('video-rtc', VideoRTC);
  </script>
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
<script>
  (function() {
    function checkMobile() {
      // In standalone (app window) mode the page is always a desktop context — skip mobile class
      if (window.matchMedia('(display-mode: standalone)').matches) return;
      const touch  = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
      const narrow = window.innerWidth <= 900 || window.screen.width <= 1100;
      document.body.classList.toggle('mobile', touch || narrow);
    }
    checkMobile();
    window.addEventListener('resize', checkMobile);
  })();
</script>

<header>
  <h1><img src="/main-logo.png" alt="PTZLite" style="height:2em;vertical-align:middle"> <span id="app-version" style="font-size:0.45em;font-weight:400;opacity:0.6;vertical-align:middle"></span></h1>
  <span id="cam-count"></span>
  <div id="stream-btns">
    <button data-stream="main" class="active">Main</button>
    <button data-stream="sub">Sub</button>
  </div>
  <div id="layout-btns"></div>
  <div id="nav-btns" style="display:none">
    <button id="prev-btn" onclick="changePage(-1)">&#8249;</button>
    <span id="page-info"></span>
    <button id="next-btn" onclick="changePage(1)">&#8250;</button>
  </div>
  <div id="rtc-status" title="Stream engine — click to reconnect" onclick="reconnectStreams()"></div>
  <button id="fullscreen-grid-btn" title="Fullscreen grid (Esc to exit)" onclick="toggleFullscreenGrid()" style="display:flex;align-items:center;justify-content:center;width:30px;height:30px;background:var(--surface2);border:1px solid var(--border2);border-radius:4px;color:var(--text-btn);cursor:pointer;transition:background 0.15s,color 0.15s;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
  </button>
  <button id="labels-btn" title="Hide camera labels" onclick="toggleLabels()" style="display:flex;align-items:center;justify-content:center;width:30px;height:30px;background:var(--surface2);border:1px solid var(--border2);border-radius:4px;color:var(--text-btn);cursor:pointer;transition:background 0.15s,color 0.15s;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
  <button id="alert-chip" title="Cameras detecting a person/vehicle — click to view" onclick="_jumpToAlert()"></button>
  <button id="chime-btn" title="Play a chime when a camera sees a person or vehicle" onclick="toggleChime()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
  </button>
  <button id="keeplive-btn" title="Keep streams live when tab is hidden" onclick="toggleKeepLive()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1" fill="currentColor"/></svg>
  </button>
  <button id="theme-btn" title="Toggle light/dark mode" onclick="toggleTheme()">
    <svg id="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
  </button>
  <a href="/settings.html" id="settings-btn" title="Camera setup">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </a>
  <button id="mob-hamburger" onclick="toggleMobileMenu()" title="Menu" aria-label="Menu">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
</header>

<div id="mob-menu">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
    <span class="mob-menu-label">Menu</span>
    <button onclick="toggleMobileMenu()" style="background:none;border:none;color:var(--text-muted);font-size:1.5rem;line-height:1;cursor:pointer;padding:0 6px;-webkit-tap-highlight-color:transparent">&#x2715;</button>
  </div>
  <span class="mob-menu-label">Layout</span>
  <div class="mob-menu-row" id="mob-layout-btns"></div>
  <div class="mob-menu-row">
    <button onclick="toggleTheme()">Theme</button>
    <button onclick="toggleLabels()">Labels</button>
    <button onclick="toggleKeepLive()">Keep Live</button>
  </div>
  <div class="mob-menu-row">
    <a href="/settings.html">Settings</a>
    <a href="/help.html">Help</a>
    <a href="/about.html">About</a>
  </div>
</div>
<div id="mob-menu-overlay" onclick="toggleMobileMenu()"></div>

<div id="server-offline">
  <div id="server-offline-card">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <h2>PTZLite has stopped</h2>
    <p>The server app is no longer running.<br>Please restart PTZLite from the Start Menu or system tray.</p>
    <button id="server-offline-retry" onclick="retryServerConnection()">Check connection</button>
    <div id="server-offline-status"></div>
  </div>
</div>

<div id="grid"></div>
<div id="mobile-nav">
  <button id="mob-prev" onclick="mobileNav(-1)">&#8249;</button>
  <span id="mob-page-info"></span>
  <button id="mob-next" onclick="mobileNav(1)">&#8250;</button>
</div>

<script src="js/core.js"></script>
<script src="js/ptz.js"></script>
<script src="js/calibration.js"></script>
<script src="js/controls.js"></script>
<script src="js/zoom.js"></script>
<script src="js/cards.js"></script>
<script src="js/app.js"></script>
</body>
</html>
