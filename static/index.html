<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PTZLite</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="manifest" href="/manifest.json">
  <script type="module">
    import { VideoRTC } from '/video-rtc.js';
    customElements.define('video-rtc', VideoRTC);
  </script>
  <style>
    :root {
      --bg:         #0d0d0d;
      --surface:    #161616;
      --surface2:   #222;
      --border:     #2a2a2a;
      --border2:    #333;
      --text:       #e0e0e0;
      --text-muted: #666;
      --text-btn:   #aaa;
      --cam-bg:     #111;
    }
    .light {
      --bg:         #f2f4f7;
      --surface:    #ffffff;
      --surface2:   #e8eaed;
      --border:     #d4d8de;
      --border2:    #c0c5cc;
      --text:       #1a1a1a;
      --text-muted: #888;
      --text-btn:   #555;
      --cam-bg:     #d8dce2;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    header h1 { font-size: 1rem; font-weight: 600; letter-spacing: 0.02em; }
    #cam-count { font-size: 0.78rem; color: var(--text-muted); }

    #stream-btns, #layout-btns, #nav-btns {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    #layout-btns { margin-left: auto; }

    #stream-btns button,
    #layout-btns button,
    #nav-btns button {
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--text-btn);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    #stream-btns button:hover,   #stream-btns button.active,
    #layout-btns button:hover,   #layout-btns button.active,
    #nav-btns button:hover { background: #2563eb; color: #fff; border-color: #2563eb; }

    #nav-btns button:disabled { opacity: 0.3; cursor: default; pointer-events: none; }
    #nav-btns button { padding: 4px 8px; }
    #nav-btns button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    #page-info { font-size: 0.72rem; color: var(--text-muted); min-width: 36px; text-align: center; }
    #nav-btns select {
      background: var(--surface2); border: 1px solid var(--border2);
      color: var(--text-btn); border-radius: 4px;
      padding: 4px 8px; font-size: 0.75rem; cursor: pointer; outline: none;
      max-width: 160px;
    }
    #nav-btns select:focus { border-color: #2563eb; }

    #settings-btn, #theme-btn, #fullscreen-grid-btn, #labels-btn, #keeplive-btn {
      display: flex; align-items: center; justify-content: center;
      width: 30px; height: 30px;
      background: var(--surface2); border: 1px solid var(--border2); border-radius: 4px;
      color: var(--text-btn); text-decoration: none; cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    #settings-btn:hover, #theme-btn:hover,
    #fullscreen-grid-btn:hover, #labels-btn:hover, #keeplive-btn:hover { background: #2563eb; color: #fff; border-color: #2563eb; }
    #keeplive-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }

    #grid {
      flex: 1;
      display: grid;
      gap: 3px;
      padding: 3px;
      overflow: hidden;
    }

    .cam-wrap {
      position: relative;
      background: var(--cam-bg);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
    }

    .cam-wrap video-rtc {
      width: 100%;
      height: 100%;
      display: block;
      background: var(--cam-bg);
    }
    .cam-wrap video-rtc video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .cam-crop video-rtc video {
      object-fit: fill;
    }
    /* Hide video-rtc's own connection-status bars — we use monitorCard for offline detection */
    .cam-wrap video-rtc > :not(video) { display: none !important; }
    /* Nearest-neighbour scaling when digitally zoomed — gives blocky pixel look */
    .cam-wrap.dz-pixelated video-rtc,
    .cam-wrap.dz-pixelated video-rtc video {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Fullscreen mode */
    .cam-wrap:fullscreen         { background: #000; }
    .cam-wrap:-webkit-full-screen { background: #000; }
    .cam-wrap:fullscreen video-rtc,
    .cam-wrap:-webkit-full-screen video-rtc { width: 100vw; height: 100vh; }

    /* Fullscreen grid — hide browser chrome */
    :fullscreen header, :-webkit-full-screen header { display: none !important; }

    .cam-label {
      position: absolute;
      top: 7px; left: 9px;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(4px);
      color: #eee;
      font-size: 0.72rem;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 4px;
      pointer-events: none;
      user-select: none;
      z-index: 2;
    }

    .ptz-badge {
      position: absolute;
      top: 7px; right: 44px;
      background: #2563eb; color: #fff;
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em;
      padding: 3px 7px; border-radius: 4px;
      pointer-events: none;
      z-index: 2;
    }

    /* Fullscreen button — top-right of every card, visible on hover */
    .fullscreen-btn {
      position: absolute;
      top: 7px; right: 9px;
      z-index: 8;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 4px;
      color: #aaa;
      cursor: pointer;
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      padding: 0;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s;
    }
    .cam-wrap:hover .fullscreen-btn       { opacity: 1; }
    .cam-wrap:fullscreen .fullscreen-btn,
    .cam-wrap:-webkit-full-screen .fullscreen-btn { opacity: 1; }
    .fullscreen-btn:hover { color: #fff; border-color: rgba(255,255,255,.4); }

    /* Calibrate-aim and controls buttons — icon buttons that live in the preset bar */
    .calib-btn, .ctrl-btn {
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 4px;
      color: #bbb;
      cursor: pointer;
      width: 27px; height: 23px;
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0;
      flex: 0 0 auto;
      pointer-events: all;
      transition: background 0.15s, color 0.15s;
    }
    .calib-btn:hover, .ctrl-btn:hover { color: #fff; border-color: rgba(255,255,255,.4); }
    .calib-btn.active, .ctrl-btn.active { color: #fff; background: #2563eb; border-color: #2563eb; }

    /* Calibration banner — top-centre instructions while calibrating a camera */
    .calib-banner {
      position: absolute;
      top: 10px; left: 50%; transform: translateX(-50%);
      z-index: 9;
      max-width: 92%;
      display: flex; align-items: center; gap: 12px;
      background: rgba(8,12,20,.86);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(96,165,250,.5);
      border-radius: 8px;
      padding: 8px 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,.45);
    }
    .calib-banner .calib-msg {
      color: #e6eefc; font-size: 0.82rem; font-weight: 500; line-height: 1.3;
    }
    .calib-banner.busy .calib-msg { color: #93c5fd; }
    .calib-banner .calib-done {
      flex: 0 0 auto;
      background: #2563eb; border: none; color: #fff;
      font-size: 0.72rem; font-weight: 600;
      padding: 4px 12px; border-radius: 5px; cursor: pointer;
    }
    .calib-banner .calib-done:hover { background: #1d4ed8; }

    /* Camera controls popover — opens above the preset bar, near its button */
    .ctrl-panel {
      position: absolute; bottom: 40px; left: 9px; z-index: 9; width: 224px;
      background: rgba(8,12,20,.93); backdrop-filter: blur(6px);
      border: 1px solid rgba(96,165,250,.4); border-radius: 8px;
      padding: 11px 12px; box-shadow: 0 6px 20px rgba(0,0,0,.5);
      display: flex; flex-direction: column; gap: 11px;
      font-size: 0.8rem; color: #e6eefc;
    }
    .ctrl-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .ctrl-row label { color: #cbd5e1; font-weight: 500; }
    .ctrl-panel input[type=range] { width: 100%; accent-color: #2563eb; cursor: pointer; }
    .ctrl-tog {
      background: #374151; border: none; color: #e6eefc;
      font-size: 0.72rem; font-weight: 600; padding: 4px 12px;
      border-radius: 5px; cursor: pointer; min-width: 50px;
    }
    .ctrl-tog.on { background: #2563eb; color: #fff; }
    .ctrl-tog:disabled { opacity: 0.5; cursor: default; }
    .ctrl-mini {
      background: none; border: 1px solid rgba(255,255,255,.25); color: #cbd5e1;
      font-size: 0.68rem; padding: 3px 9px; border-radius: 5px; cursor: pointer;
    }
    .ctrl-mini:hover { color: #fff; border-color: #fff; }
    .ctrl-note { color: #93a3b8; font-size: 0.7rem; }
    .ctrl-seg {
      background: #374151; border: none; color: #cbd5e1;
      font-size: 0.68rem; font-weight: 600; padding: 3px 8px;
      border-radius: 4px; cursor: pointer;
    }
    .ctrl-seg.on { background: #2563eb; color: #fff; }
    .ctrl-more {
      background: none; border: 1px solid rgba(255,255,255,.18); color: #cbd5e1;
      font-size: 0.72rem; font-weight: 600; padding: 4px 0; border-radius: 5px;
      cursor: pointer; width: 100%;
    }
    .ctrl-more:hover { color: #fff; border-color: rgba(255,255,255,.4); }

    /* Live detection alert — glowing border + badge on a camera that's detecting */
    .cam-wrap.alerting { outline: 2px solid #f59e0b; outline-offset: -2px; }
    .cam-wrap.alerting.ai { outline-color: #ef4444; }
    .detect-badge {
      position: absolute; top: 7px; left: 9px; z-index: 8;
      display: none; align-items: center; gap: 5px;
      background: rgba(239,68,68,.92); color: #fff;
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.03em;
      padding: 3px 9px; border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,.4);
      animation: detect-pulse 1.2s ease-in-out infinite;
    }
    .detect-badge.motion { background: rgba(245,158,11,.92); }
    .cam-wrap.alerting .detect-badge { display: flex; }
    @keyframes detect-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }

    /* PTZ overlay */
    .ptz-overlay {
      position: absolute;
      inset: 0;
      cursor: crosshair;
      z-index: 3;
    }

    .reticle {
      position: absolute;
      top: 50%; left: 50%;
      width: 22px; height: 22px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 4;
    }
    .reticle::before, .reticle::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.35);
    }
    .reticle::before { width: 1px; height: 100%; left: 50%; }
    .reticle::after  { height: 1px; width: 100%; top: 50%; }

    .ripple {
      position: absolute;
      width: 36px; height: 36px;
      border: 2px solid rgba(255,255,255,0.9);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.3);
      animation: ripple-out 0.45s ease-out forwards;
      z-index: 5;
    }
    @keyframes ripple-out {
      to { transform: translate(-50%, -50%) scale(1.8); opacity: 0; }
    }

    .preset-bar {
      position: absolute;
      bottom: 7px; left: 9px; right: 9px;
      display: flex; gap: 4px; flex-wrap: wrap;
      z-index: 5;
      pointer-events: none;
    }
    .preset-btn {
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(4px);
      color: #ddd;
      font-size: 0.65rem; font-weight: 600; letter-spacing: 0.04em;
      padding: 3px 9px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 4px;
      cursor: pointer;
      pointer-events: all;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .preset-btn:hover { background: rgba(37,99,235,.85); color: #fff; border-color: #2563eb; }
    .preset-btn.monitor { border-color: rgba(250,204,21,.4); color: #fcd34d; }
    .preset-btn.monitor:hover { background: rgba(161,98,7,.85); border-color: #ca8a04; }
    .preset-btn.failed { animation: preset-fail 0.6s ease-out forwards; }
    @keyframes preset-fail {
      0%   { background: rgba(220,38,38,.85); border-color: #dc2626; color: #fff; }
      100% { background: rgba(0,0,0,.65); border-color: rgba(255,255,255,.15); color: #ddd; }
    }

    .joystick-ring {
      position: absolute;
      width: 120px; height: 120px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 6;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.25);
    }
    .joystick-knob {
      position: absolute;
      width: 20px; height: 20px;
      background: rgba(255,255,255,0.85);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 7;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    /* go2rtc status dot */
    #rtc-status {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #555;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.4s;
      title: 'Stream engine';
    }
    #rtc-status.ok  { background: #22c55e; }
    #rtc-status.err { background: #ef4444; box-shadow: 0 0 6px #ef4444; }

    /* ── Server-stopped full-page overlay ── */
    #server-offline {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
    }
    #server-offline.visible { display: flex; }
    #server-offline-card {
      background: var(--surface);
      border: 1px solid #dc2626;
      border-radius: 12px;
      padding: 36px 40px;
      max-width: 380px;
      width: 90%;
      text-align: center;
      box-shadow: 0 0 40px rgba(220,38,38,0.25);
    }
    #server-offline-card svg { color: #ef4444; margin-bottom: 16px; }
    #server-offline-card h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 10px; }
    #server-offline-card p  { font-size: 0.85rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 22px; }
    #server-offline-retry {
      background: #1e3a5f; border: 1px solid #2563eb; color: #93c5fd;
      border-radius: 6px; padding: 9px 24px; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
    }
    #server-offline-retry:hover { background: #2563eb; color: #fff; }
    #server-offline-status { font-size: 0.75rem; color: var(--text-muted); margin-top: 14px; min-height: 18px; }

    /* Per-card stream-offline overlay */
    .stream-offline {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.55);
      z-index: 9;
      gap: 10px;
      pointer-events: none;
    }
    .stream-offline span { color: #fca5a5; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.03em; }
    .stream-offline button {
      pointer-events: all;
      background: #1e3a5f; border: 1px solid #2563eb; color: #93c5fd;
      border-radius: 4px; padding: 4px 14px; font-size: 0.72rem; cursor: pointer;
    }
    .stream-offline button:hover { background: #2563eb; color: #fff; }

    #grid.hide-labels .cam-label { display: none; }

    .snap-btn {
      position: absolute; bottom: 7px; right: 9px; z-index: 8;
      background: rgba(0,0,0,.65); backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,.15); border-radius: 4px;
      color: #aaa; cursor: pointer; width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      padding: 0; opacity: 0; transition: opacity 0.15s, color 0.15s;
    }
    .cam-wrap:hover .snap-btn { opacity: 1; }
    .snap-btn:hover { color: #fff; border-color: rgba(255,255,255,.4); }

    /* In-fullscreen stream toggle — [Main] [Sub] pill, centred at bottom */
    .fs-stream-toggle {
      position: absolute;
      bottom: 7px; left: 50%; transform: translateX(-50%);
      z-index: 8;
      display: flex;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 6px;
      padding: 3px;
      gap: 2px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      white-space: nowrap;
    }
    .cam-wrap:fullscreen .fs-stream-toggle,
    .cam-wrap:-webkit-full-screen .fs-stream-toggle { opacity: 1; pointer-events: all; }
    .fs-stream-btn {
      background: none;
      border: none;
      color: #aaa;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 3px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }
    .fs-stream-btn.active { background: #2563eb; color: #fff; }
    .fs-stream-btn:hover:not(.active) { color: #fff; background: rgba(255,255,255,.12); }

    .audio-btn {
      position: absolute; bottom: 7px; right: 40px; z-index: 8;
      background: rgba(0,0,0,.65); backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,.15); border-radius: 4px;
      color: #aaa; cursor: pointer; width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      padding: 0; opacity: 0; transition: opacity 0.15s, color 0.15s;
    }
    .cam-wrap:hover .audio-btn { opacity: 1; }
    .audio-btn:hover { color: #fff; border-color: rgba(255,255,255,.4); }

    /* ══ MOBILE UI ══════════════════════════════════════════════════════════════
       Applied via JS (applyMobileUI) on touch devices — no media query needed.
       All rules use #mob- prefixed IDs or .mob- classes so they don't conflict. */

    /* Hamburger button — hidden on desktop, shown by JS */
    #mob-hamburger {
      display: none;
      align-items: center; justify-content: center;
      width: 36px; height: 36px;
      background: var(--surface2); border: 1px solid var(--border2);
      border-radius: 6px; color: var(--text); cursor: pointer;
      flex-shrink: 0;
      margin-left: auto;
      -webkit-tap-highlight-color: transparent;
    }

    /* Mobile dropdown menu */
    #mob-menu {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      background: var(--surface);
      border-bottom: 2px solid var(--border2);
      z-index: 300;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    #mob-menu.open { display: flex; }
    .mob-menu-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .mob-menu-row a, .mob-menu-row button {
      flex: 1;
      min-width: 80px;
      padding: 10px 8px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.85rem;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .mob-menu-row button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    .mob-menu-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    #mob-menu-overlay {
      display: none;
      position: fixed; inset: 0;
      z-index: 299;
    }
    #mob-menu-overlay.open { display: block; }

    /* Bottom navigation bar */
    #mobile-nav {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: calc(64px + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: var(--surface);
      border-top: 2px solid var(--border2);
      z-index: 200;
      align-items: stretch;
    }
    #mob-prev, #mob-next {
      flex: 1;
      background: none;
      border: none;
      color: var(--text);
      font-size: 2.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      cursor: pointer;
    }
    #mob-prev:not(:disabled):active, #mob-next:not(:disabled):active {
      background: #2563eb; color: #fff;
    }
    #mob-prev:disabled, #mob-next:disabled { opacity: 0.2; }
    #mob-page-info {
      flex: 0 0 auto;
      min-width: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
<script>
  (function() {
    function checkMobile() {
      // In standalone (app window) mode the page is always a desktop context — skip mobile class
      if (window.matchMedia('(display-mode: standalone)').matches) return;
      const touch  = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
      const narrow = window.innerWidth <= 900 || window.screen.width <= 1100;
      document.body.classList.toggle('mobile', touch || narrow);
    }
    checkMobile();
    window.addEventListener('resize', checkMobile);
  })();
</script>

<script>
// ── Stream state ─────────────────────────────────────────────────────────────

let activeStream = 'main';
let go2rtcPort   = 1984;

function streamSrc(camId) {
  return `ws://${location.hostname}:${go2rtcPort}/api/ws?src=${camId}_${activeStream}`;
}

function setStream(stream) {
  if (stream === activeStream) return;
  activeStream = stream;
  document.querySelectorAll('#stream-btns button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.stream === stream);
  });
  renderGrid();
}

// ── Theme ─────────────────────────────────────────────────────────────────────
const MOON_ICON = `<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>`;
const SUN_ICON  = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`;

function applyTheme(light) {
  document.body.classList.toggle('light', light);
  document.getElementById('theme-icon').innerHTML = light ? SUN_ICON : MOON_ICON;
  document.getElementById('theme-btn').title = light ? 'Switch to dark mode' : 'Switch to light mode';
}

function toggleTheme() {
  const light = !document.body.classList.contains('light');
  localStorage.setItem('theme', light ? 'light' : 'dark');
  applyTheme(light);
}

document.getElementById('stream-btns').addEventListener('click', e => {
  const btn = e.target.closest('button[data-stream]');
  if (btn) setStream(btn.dataset.stream);
});

// ── Layout & pagination ───────────────────────────────────────────────────────

const LAYOUTS = [
  { label: '1×1', cols: 1, rows: 1 },
  { label: '2×1', cols: 2, rows: 1 },
  { label: '2×2', cols: 2, rows: 2 },
  { label: '3×2', cols: 3, rows: 2 },
  { label: '3×3', cols: 3, rows: 3 },
  { label: '4×4', cols: 4, rows: 4 },
];

let _layout        = LAYOUTS[2];
let _page          = 0;
let _cameras       = [];
let _pageGroups    = [];
let _groupIdx      = 0;
let _useNamedPages = false;
let _labelsVisible = true;
let _keepLive = false;

function perPage() { return _layout.cols * _layout.rows; }

function computePageGroups(cams) {
  const map = new Map();
  cams.forEach(cam => {
    const key = cam.page || '';
    if (!map.has(key)) map.set(key, { name: cam.page || null, cameras: [] });
    map.get(key).cameras.push(cam);
  });
  return [...map.values()];
}

function currentCamList() {
  if (_useNamedPages && _pageGroups.length > 0) return _pageGroups[_groupIdx].cameras;
  return _cameras;
}

function pageCount() { return Math.max(1, Math.ceil(currentCamList().length / perPage())); }

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  grid.style.gridTemplateColumns = `repeat(${_layout.cols}, 1fr)`;
  grid.style.gridTemplateRows    = `repeat(${_layout.rows}, 1fr)`;

  const cams  = currentCamList();
  const start = _page * perPage();
  const slice = cams.slice(start, start + perPage());
  slice.forEach((cam, i) => grid.appendChild(buildCard(cam, i * 500)));

  for (let i = slice.length; i < perPage(); i++) {
    const empty = document.createElement('div');
    empty.className = 'cam-wrap';
    grid.appendChild(empty);
  }

  const navEl = document.getElementById('nav-btns');
  const pc = pageCount();

  if (_useNamedPages) {
    navEl.style.display = '';
    const opts = _pageGroups.map((g, i) =>
      `<option value="${i}"${i === _groupIdx ? ' selected' : ''}>${g.name || 'All'}</option>`
    ).join('');
    const sub = pc > 1
      ? `<button id="prev-btn" onclick="changePage(-1)" ${_page === 0 ? 'disabled' : ''}>&#8249;</button>` +
        `<span id="page-info" style="font-size:0.72rem;color:var(--text-muted);min-width:36px;text-align:center">${_page + 1}/${pc}</span>` +
        `<button id="next-btn" onclick="changePage(1)" ${_page >= pc - 1 ? 'disabled' : ''}>&#8250;</button>`
      : '';
    navEl.innerHTML = `<select onchange="selectGroup(parseInt(this.value))">${opts}</select>` + sub;
  } else {
    navEl.style.display = pc > 1 ? '' : 'none';
    navEl.innerHTML =
      `<button id="prev-btn" onclick="changePage(-1)" ${_page === 0 ? 'disabled' : ''}>&#8249;</button>` +
      `<span id="page-info" style="font-size:0.72rem;color:var(--text-muted);min-width:36px;text-align:center">${_page + 1} / ${pc}</span>` +
      `<button id="next-btn" onclick="changePage(1)" ${_page >= pc - 1 ? 'disabled' : ''}>&#8250;</button>`;
  }

  _syncMobileNav();
  _startDetectionPolling();
}

// ── Live detection poller ─────────────────────────────────────────────────────
// Polls /detect/states (all Reolink cameras in one request) and glows / badges
// any card whose camera is actively seeing a person/vehicle/motion.
let _detectPollTimer = null;
const _DETECT_LABELS = { people: 'Person', vehicle: 'Vehicle', dog_cat: 'Animal', face: 'Face', package: 'Package' };
function _startDetectionPolling() {
  if (_detectPollTimer) return;
  const poll = async () => {
    if (document.hidden) return;
    let states;
    try { states = await fetch('/detect/states').then(r => r.json()); } catch { return; }
    document.querySelectorAll('.cam-wrap[data-cam-id]').forEach(wrap => {
      const s = states[wrap.dataset.camId];
      const badge = wrap.querySelector('.detect-badge');
      const ai = s && s.alerts && s.alerts.length;
      if (!s || (!ai && !s.motion)) {
        wrap.classList.remove('alerting', 'ai');
        return;
      }
      wrap.classList.add('alerting');
      wrap.classList.toggle('ai', !!ai);
      if (badge) {
        badge.classList.toggle('motion', !ai);
        badge.textContent = ai ? s.alerts.map(t => _DETECT_LABELS[t] || t).join(' · ') : 'Motion';
      }
    });
  };
  _detectPollTimer = setInterval(poll, 3000);
  poll();
}

function setLayout(layout) {
  _layout = layout;
  _page   = 0;
  renderGrid();
  document.querySelectorAll('#layout-btns button').forEach(b => {
    b.classList.toggle('active', b.dataset.layout === layout.label);
  });
}

function changePage(delta) {
  _page = Math.max(0, Math.min(pageCount() - 1, _page + delta));
  renderGrid();
}

function selectGroup(idx) {
  _groupIdx = idx;
  _page = 0;
  renderGrid();
}

function mobileNav(dir) {
  if (_useNamedPages) {
    const ni = _groupIdx + dir;
    if (ni >= 0 && ni < _pageGroups.length) selectGroup(ni);
  } else {
    changePage(dir);
  }
}

function _syncMobileNav() {
  const prev = document.getElementById('mob-prev');
  const next = document.getElementById('mob-next');
  const info = document.getElementById('mob-page-info');
  if (!prev) return;
  if (_useNamedPages) {
    prev.disabled = _groupIdx <= 0;
    next.disabled = _groupIdx >= _pageGroups.length - 1;
    info.textContent = _pageGroups[_groupIdx]?.name || 'All';
  } else {
    const pc = pageCount();
    prev.disabled = _page <= 0;
    next.disabled = _page >= pc - 1;
    info.textContent = pc > 1 ? `${_page + 1} / ${pc}` : '';
  }
}

function defaultLayout(n) {
  if (n <= 1) return LAYOUTS[0];
  if (n <= 2) return LAYOUTS[1];
  if (n <= 4) return LAYOUTS[2];
  if (n <= 6) return LAYOUTS[3];
  if (n <= 9) return LAYOUTS[4];
  return LAYOUTS[5];
}

// ── PTZ Joystick ─────────────────────────────────────────────────────────────

const JOYSTICK_MAX_PX   = 60;
const JOYSTICK_DEAD_PX  =  8;
const JOYSTICK_CLICK_PX =  6;
const JOYSTICK_RATE_MS  = 80;

const _joysticks     = {};
const _dblClickState = {};   // camId → { t: 0, timer: null } for double-click-to-fullscreen

// Normalise mouse and touch events to a plain {clientX, clientY} object.
function _evClientXY(e) {
  const t = e.touches?.[0] ?? e.changedTouches?.[0];
  return t ? { clientX: t.clientX, clientY: t.clientY } : { clientX: e.clientX, clientY: e.clientY };
}

function joystickStart(e, overlay, camId) {
  if (e.button !== undefined && e.button !== 0) return;  // ignore right/middle mouse; touch has no .button
  e.preventDefault();

  const { clientX, clientY } = _evClientXY(e);
  const rect = overlay.getBoundingClientRect();
  const ox = clientX - rect.left;
  const oy = clientY - rect.top;

  const ring = document.createElement('div');
  ring.className = 'joystick-ring';
  ring.style.left = `${ox}px`;
  ring.style.top  = `${oy}px`;
  overlay.appendChild(ring);

  const knob = document.createElement('div');
  knob.className = 'joystick-knob';
  knob.style.left = `${ox}px`;
  knob.style.top  = `${oy}px`;
  overlay.appendChild(knob);

  const state = {
    active: true,
    originX: clientX, originY: clientY,
    overlayLeft: rect.left, overlayTop: rect.top,
    ox, oy,
    ring, knob,
    moved: false,
    wasMoving: false,
    lastX: 0, lastY: 0,
    timer: null,
    startCoords: { clientX, clientY },
  };
  _joysticks[camId] = state;

  function onMove(ev) {
    ev.preventDefault?.();
    if (state.active) joystickMove(_evClientXY(ev), state, camId);
  }
  function onUp() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup',   onUp);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend',  onUp);
    joystickEnd(overlay, state, camId);
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup',   onUp);
  document.addEventListener('touchmove', onMove, { passive: false });
  document.addEventListener('touchend',  onUp);
}

function joystickMove({ clientX, clientY }, state, camId) {
  const dx = clientX - state.originX;
  const dy = clientY - state.originY;
  const dist = Math.hypot(dx, dy);

  if (dist > JOYSTICK_CLICK_PX) state.moved = true;

  const clamped = Math.min(dist, JOYSTICK_MAX_PX);
  const angle   = Math.atan2(dy, dx);
  state.knob.style.left = `${state.ox + Math.cos(angle) * clamped}px`;
  state.knob.style.top  = `${state.oy + Math.sin(angle) * clamped}px`;

  if (dist < JOYSTICK_DEAD_PX) {
    state.lastX = 0; state.lastY = 0;
    if (state.wasMoving) {
      state.wasMoving = false;
      fetch(`/ptz/${camId}/stop`, { method: 'POST' }).catch(() => {});
    }
    return;
  }

  const mag  = clamped / JOYSTICK_MAX_PX;
  state.lastX = Math.cos(angle) * mag;
  state.lastY = Math.sin(angle) * mag;
  state.wasMoving = true;

  if (state.timer) return;
  state.timer = setTimeout(() => {
    state.timer = null;
    if (state.active && state.wasMoving) {
      fetch(`/ptz/${camId}/start`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ x: state.lastX, y: state.lastY }),
      }).catch(() => {});
    }
  }, JOYSTICK_RATE_MS);
}

function joystickEnd(overlay, state, camId) {
  state.active = false;
  if (state.timer) { clearTimeout(state.timer); state.timer = null; }
  state.ring.remove();
  state.knob.remove();
  delete _joysticks[camId];

  // Always stop if the joystick was pulsing — even on a click, in-flight /start
  // requests can arrive at the camera after the click-to-move command, leaving it running.
  if (state.wasMoving) {
    fetch(`/ptz/${camId}/stop`, { method: 'POST' }).catch(() => {});
  }
  if (!state.moved) {
    // Double-click detection: first click deferred 280 ms; second click within that
    // window cancels the PTZ command and goes fullscreen instead.
    const now = Date.now();
    const ds  = _dblClickState[camId] || (_dblClickState[camId] = { t: 0, timer: null });
    if (now - ds.t < 300 && ds.timer) {
      // Second click — go fullscreen, suppress both PTZ moves
      clearTimeout(ds.timer);
      ds.timer = null;
      ds.t     = 0;
      const wrap = overlay.closest('.cam-wrap');
      if (wrap) _enterCamFullscreen(wrap);
    } else {
      // First click — defer so a second click can cancel it
      ds.t = now;
      const coords = state.startCoords;
      ds.timer = setTimeout(() => {
        ds.timer = null;
        ds.t     = 0;
        handlePtzClick(coords, overlay, camId);
      }, 280);
    }
    return;
  }
}

// ── PTZ click ─────────────────────────────────────────────────────────────────

function showRipple(overlay, x, y) {
  const r = document.createElement('div');
  r.className = 'ripple';
  r.style.left = `${x * 100}%`;
  r.style.top  = `${y * 100}%`;
  overlay.appendChild(r);
  r.addEventListener('animationend', () => r.remove(), { once: true });
}

const _ptzBusy = {};  // camId → bool; true while a click-to-centre move is in flight

async function handlePtzClick(e, overlay, camId) {
  const rect = overlay.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const y = (e.clientY - rect.top)  / rect.height;

  // In calibration mode, clicks drive the guided two-click flow instead of a move
  if (_calib[camId]) { handleCalibClick(camId, overlay, x, y); return; }

  if (_ptzBusy[camId]) return;   // ignore all clicks until current move completes
  _ptzBusy[camId] = true;
  showRipple(overlay, x, y);
  try {
    await fetch(`/ptz/${camId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ x, y }),
    });
  } catch (err) { console.error('PTZ error:', err); }
  finally { _ptzBusy[camId] = false; }
}

// ── PTZ aim calibration ───────────────────────────────────────────────────────
// Guided two-click flow: click a fixed object, the camera centres on it, then
// click the same object where it actually landed. The residual is sent to
// /calibrate which scales the per-axis gain so a repeat lands dead centre.
const _calib = {};           // camId → { phase, before } while calibrating
const CALIB_SETTLE_MS = 1800; // wait for the gimbal to stop before the 2nd click

function startCalibration(cam, wrap) {
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    _enterCamFullscreen(wrap);   // bigger view = more accurate clicks
  }
  _calib[cam.id] = { phase: 'before', before: null };
  const banner = _ensureCalibBanner(wrap, cam.id);
  _setCalibMsg(cam.id, 'Click a fixed object near an edge of the frame', false);
}

function stopCalibration(camId) {
  delete _calib[camId];
  document.querySelector(`.calib-banner[data-cam="${CSS.escape(camId)}"]`)?.remove();
  document.querySelector(`.cam-wrap[data-cam-id="${CSS.escape(camId)}"] .calib-btn`)
    ?.classList.remove('active');
}

// Shared banner shell: a message span plus one or more action buttons.
// `buttons` is a list of { label, onClick }.
function _makeBanner(wrap, camId, buttons) {
  wrap.querySelector('.calib-banner')?.remove();
  const b = document.createElement('div');
  b.className = 'calib-banner';
  b.dataset.cam = camId;
  const msg = document.createElement('span');
  msg.className = 'calib-msg';
  b.appendChild(msg);
  for (const spec of buttons) {
    const btn = document.createElement('button');
    btn.className = 'calib-done';
    btn.textContent = spec.label;
    btn.addEventListener('click', e => { e.stopPropagation(); spec.onClick(); });
    b.appendChild(btn);
  }
  wrap.appendChild(b);
  return b;
}

function _ensureCalibBanner(wrap, camId) {
  return _makeBanner(wrap, camId, [{
    label: 'Done',
    onClick: () => { stopCalibration(camId); wrap._calibBtn?.classList.remove('active'); },
  }]);
}

function _setCalibMsg(camId, text, busy) {
  const b = document.querySelector(`.calib-banner[data-cam="${CSS.escape(camId)}"]`);
  if (!b) return;
  b.querySelector('.calib-msg').textContent = text;
  b.classList.toggle('busy', !!busy);
}

async function handleCalibClick(camId, overlay, x, y) {
  const cal = _calib[camId];
  if (!cal || cal.phase === 'moving' || cal.phase === 'saving') return;
  showRipple(overlay, x, y);

  if (cal.phase === 'before') {
    cal.before = { x, y };
    cal.phase  = 'moving';
    _setCalibMsg(camId, 'Moving — wait for the camera to settle…', true);
    try {
      await fetch(`/ptz/${camId}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ x, y }),
      });
    } catch (err) { console.error('Calib move error:', err); }
    setTimeout(() => {
      if (_calib[camId]?.phase === 'moving') {
        _calib[camId].phase = 'after';
        _setCalibMsg(camId, 'Now click that SAME object where it ended up', false);
      }
    }, CALIB_SETTLE_MS);
    return;
  }

  // phase === 'after'
  cal.phase = 'saving';
  let res = null;
  try {
    res = await fetch(`/ptz/${camId}/calibrate`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ before: cal.before, after: { x, y } }),
    }).then(r => r.json());
  } catch (err) { console.error('Calibrate error:', err); }

  if (_calib[camId]) {           // user may have hit Done mid-request
    _calib[camId].before = null;
    _calib[camId].phase  = 'before';
    _setCalibMsg(camId, _calibResultText(res), false);
  }
}

function _calibResultText(res) {
  if (!res || res.ok === false) {
    return 'Calibration failed — click a fixed edge object to try again.';
  }
  if (res.updated && res.updated.length) {
    const parts = res.updated.map(u => `${u.axis} ${u.old}→${u.new}`);
    const off = Math.round(Math.max(...res.updated.map(u => Math.abs(u.residual))) * 100);
    return `Saved ${parts.join(', ')} · landed ${off}% off centre. `
         + 'Click an edge object to refine, or Done.';
  }
  return 'Not enough travel to measure — pick an object nearer an edge, then re-centre.';
}

// ── Automatic PTZ aim calibration ─────────────────────────────────────────────
// Runs progressively larger timed moves and measures how far the scene actually
// shifts by 1-D image cross-correlation, then least-squares-fits a per-axis motor
// model  duration = degrees/dps + lead.  `lead` captures motor acceleration, so
// both small and large moves land accurately. No clicking — nothing leaves frame.
const _autoCal = {};   // camId → { cancel } while an auto run is in progress

function cancelAutoCalibration(camId) {
  const st = _autoCal[camId];
  if (st) st.cancel = true;
}

function _sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function _rawMove(camId, axis, dir, seconds) {
  try {
    await fetch(`/ptz/${camId}/raw_move`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ axis, dir, seconds }),
    });
  } catch (e) { /* a dropped probe is simply skipped */ }
}

// Downsampled, zero-mean grayscale matrix of the frame, for 2-D block matching.
// Keeping the full 2-D image (not a 1-D strip) means unique objects — cars, a
// skip, houses — anchor the match, so a scene that merely has a repeating TEXTURE
// (paving, decking) in one direction is no longer mistaken for an ambiguous one.
function _grayMat(vid, ctx, gw, gh) {
  ctx.drawImage(vid, 0, 0, gw, gh);
  const d = ctx.getImageData(0, 0, gw, gh).data;
  const m = new Float32Array(gw * gh);
  let mean = 0;
  for (let p = 0, i = 0; p < gw * gh; p++, i += 4) {
    const v = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    m[p] = v; mean += v;
  }
  mean /= (gw * gh);
  for (let p = 0; p < m.length; p++) m[p] -= mean;
  return m;
}

// Coarse grayscale snapshot (subsampled) — used to detect when the picture has
// stopped changing after a move (motion settled AND stream latency caught up).
function _grayFrame(vid, ctx, cw, ch) {
  ctx.drawImage(vid, 0, 0, cw, ch);
  const d = ctx.getImageData(0, 0, cw, ch).data;
  const out = [];
  for (let y = 0; y < ch; y += 8) {
    for (let x = 0; x < cw; x += 8) {
      const i = (y * cw + x) * 4;
      out.push(0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]);
    }
  }
  return out;
}

// Wait until the picture has stopped changing. `minMs` is an initial wait used
// after a move to let the (latency-delayed) stream actually START showing the new
// view — otherwise the not-yet-updated frame looks "stable" and we'd lock onto the
// stale pre-move image (measuring zero movement). Then watch for two stable reads.
async function _settle(vid, ctx, cw, ch, minMs = 0, maxMs = 2800) {
  if (minMs) await _sleep(minMs);
  let prev = _grayFrame(vid, ctx, cw, ch);
  const t0 = Date.now();
  let stable = 0;
  while (Date.now() - t0 < maxMs) {
    await _sleep(140);
    const cur = _grayFrame(vid, ctx, cw, ch);
    let diff = 0;
    for (let i = 0; i < cur.length; i++) diff += Math.abs(cur[i] - prev[i]);
    diff /= cur.length;
    prev = cur;
    if (diff < 3.0) { stable += 140; if (stable >= 280) return; }
    else stable = 0;
  }
}

// 2-D normalised cross-correlation over a search window. Returns the sub-pixel
// shift (dx,dy), peak confidence (-1..1), and `ratio` = best peak ÷ the strongest
// SEPARATE local-maximum peak. A genuinely repeating scene yields a rival peak
// (ratio≈1); a unique scene does not, regardless of any repeating texture.
function _xcorr2d(ref, cur, gw, gh, maxDx, maxDy) {
  const W = 2 * maxDx + 1, H = 2 * maxDy + 1;
  const grid = new Float32Array(W * H);
  let best = -2, bdx = 0, bdy = 0;
  for (let dy = -maxDy; dy <= maxDy; dy++) {
    const y0 = Math.max(0, -dy), y1 = Math.min(gh, gh - dy);
    for (let dx = -maxDx; dx <= maxDx; dx++) {
      const x0 = Math.max(0, -dx), x1 = Math.min(gw, gw - dx);
      let s = 0, na = 0, nb = 0;
      for (let y = y0; y < y1; y++) {
        let r = y * gw + x0, c = (y + dy) * gw + x0 + dx;
        for (let x = x0; x < x1; x++, r++, c++) {
          const a = ref[r], b = cur[c];
          s += a * b; na += a * a; nb += b * b;
        }
      }
      const cc = (na > 1e-6 && nb > 1e-6) ? s / Math.sqrt(na * nb) : 0;
      grid[(dy + maxDy) * W + (dx + maxDx)] = cc;
      if (cc > best) { best = cc; bdx = dx; bdy = dy; }
    }
  }
  const sepx = Math.max(2, Math.floor(W * 0.12)), sepy = Math.max(2, Math.floor(H * 0.12));
  let second = -2;
  for (let iy = 1; iy < H - 1; iy++) {
    for (let ix = 1; ix < W - 1; ix++) {
      if (Math.abs(ix - maxDx - bdx) < sepx && Math.abs(iy - maxDy - bdy) < sepy) continue;
      const c = grid[iy * W + ix];
      if (c >= grid[iy * W + ix - 1] && c >= grid[iy * W + ix + 1] &&
          c >= grid[(iy - 1) * W + ix] && c >= grid[(iy + 1) * W + ix] && c > second) second = c;
    }
  }
  const ratio = second > 0.05 ? best / second : 9;
  const at = (dx, dy) => (dx >= -maxDx && dx <= maxDx && dy >= -maxDy && dy <= maxDy)
    ? grid[(dy + maxDy) * W + (dx + maxDx)] : null;
  let sdx = bdx, sdy = bdy;
  const xm = at(bdx - 1, bdy), xp = at(bdx + 1, bdy);
  if (xm !== null && xp !== null) { const dd = xm - 2 * best + xp; if (dd !== 0) sdx = bdx + 0.5 * (xm - xp) / dd; }
  const ym = at(bdx, bdy - 1), yp = at(bdx, bdy + 1);
  if (ym !== null && yp !== null) { const dd = ym - 2 * best + yp; if (dd !== 0) sdy = bdy + 0.5 * (ym - yp) / dd; }
  return { dx: sdx, dy: sdy, conf: best, ratio };
}

// One probe: settle, snapshot, move `t`s in `dir`, settle, measure the 2-D shift.
// Searches the full move axis but only a small cross-axis band. `cap` (pixels)
// limits the move-axis search once a speed estimate exists, to reject aliasing.
// Does NOT return to start — the caller pairs +dir/-dir probes so drift cancels.
async function _probe(camId, axis, t, dir, vid, ctx, gw, gh, state, cap) {
  await _settle(vid, ctx, gw, gh);          // confirm the starting view is steady
  if (state.cancel) return null;
  const ref = _grayMat(vid, ctx, gw, gh);
  await _rawMove(camId, axis, dir, t);
  await _settle(vid, ctx, gw, gh, 600);     // 600ms latency bridge, THEN wait for steady
  if (state.cancel) return null;
  const cur = _grayMat(vid, ctx, gw, gh);
  const mainSpan = Math.floor((axis === 'pan' ? gw : gh) * 0.45);
  const maxMain  = cap ? Math.max(3, Math.min(mainSpan, Math.ceil(cap))) : mainSpan;
  const maxCross = Math.max(3, Math.floor((axis === 'pan' ? gh : gw) * 0.08));
  const maxDx = axis === 'pan' ? maxMain : maxCross;
  const maxDy = axis === 'tilt' ? maxMain : maxCross;
  const r = _xcorr2d(ref, cur, gw, gh, maxDx, maxDy);
  const comp = axis === 'pan' ? r.dx / gw : r.dy / gh;
  return { normShift: Math.abs(comp), conf: r.conf, ratio: r.ratio };
}

async function _calibrateAxisAuto(camId, fov, vid, axis, state, setMsg) {
  const vw = vid.videoWidth, vh = vid.videoHeight;
  // Small grid keeps 2-D matching fast; enough resolution for sub-pixel shifts.
  const gw = 96, gh = Math.max(40, Math.round(96 * vh / vw));
  const canvas = document.createElement('canvas');
  canvas.width = gw; canvas.height = gh;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  // Exact camera rotation for a normalised screen shift: a shift of `ns` (fraction
  // of the frame) means a feature moved to 2·ns of the half-frame, i.e. the same
  // geometry a click uses — tan(θ)=2·ns·tan(FOV/2). Using atan (not the small-angle
  // linear form) avoids over-reading bigger shifts and keeps cal consistent with clicks.
  const tanHalf    = Math.tan(fov * Math.PI / 360);
  const degOf      = (ns) => Math.atan(2 * ns * tanHalf) * 180 / Math.PI;
  const degPerNorm = 2 * tanHalf * 180 / Math.PI;   // small-angle slope, for window sizing only
  const base = axis === 'pan' ? gw : gh;
  const MIN_CONF  = 0.3;    // a genuine image match
  const MIN_RATIO = 1.12;   // dominant peak — rejects a genuinely repeating scene
  const TARGET    = 0.22;   // aim each probe at ~22% of the frame — a "serious" move with unique structure
  const ratios    = [];     // collected degrees-per-second samples
  let est = 0;              // running dps estimate; seeds the anti-alias search window
  // ±window (in correlation lag) expected for a move, from the current estimate.
  const capFor = (t) => est ? Math.max(4, (est * t / degPerNorm) * base * 1.6) : 0;

  // ── Phase 1: range-find a clean base move time ──
  // Grow/shrink the move until one probe lands a confident, unambiguous 2-D match
  // of ~TARGET size:
  //  • featureless / travel-limit (low confidence, e.g. tilt into sky) → flip direction
  //  • genuinely repeating scene (rival peak) → shrink (more overlap shares more
  //    unique structure); too big (frames barely overlap) → shrink too
  //  • the first clean shift seeds `est`, and every later probe is locked to a
  //    search window around the expected position, so a wrong match can't sneak in.
  let t = 0.18, tBase = 0;
  let dir = axis === 'tilt' ? -1 : 1;   // tilt: probe DOWN first (toward ground, away from sky)
  for (let attempt = 0; attempt < 11 && !tBase; attempt++) {
    if (state.cancel) return null;
    setMsg(`Finding ${axis} range… (${attempt + 1})`, true);
    const p = await _probe(camId, axis, t, dir, vid, ctx, gw, gh, state, capFor(t));
    if (!p || state.cancel) return null;
    await _rawMove(camId, axis, -dir, t);   // return to start
    await _settle(vid, ctx, gw, gh, 600);
    if (p.conf >= MIN_CONF && p.ratio >= MIN_RATIO && p.normShift >= 0.03 && p.normShift <= 0.4) {
      tBase = t;
      est = degOf(p.normShift) / t;
      ratios.push(est);
    } else if (p.conf < MIN_CONF || p.normShift < 0.012) {
      dir = -dir;                                  // featureless or hit a limit — try the other way
    } else if (p.ratio < MIN_RATIO || p.normShift > 0.4) {
      t = Math.max(0.05, t * 0.6);                 // repeating or too big — smaller, more-overlap move
    } else {
      const grow = p.normShift > 0.02 ? TARGET / p.normShift : 2.2;
      t = Math.min(2.5, t * Math.min(grow, 5));    // too small — grow toward the target shift
    }
  }
  if (!tBase) return { error: `couldn't track ${axis} cleanly (no usable view either way)` };
  const probeDir = dir;   // the direction that had texture — lead with it in phase 2

  // ── Phase 2: repeated bidirectional probes around the base ──
  const sizes = [0.75, 1.25];
  let n = 0; const total = sizes.length * 2;
  for (const f of sizes) {
    const tp = Math.max(0.05, Math.min(2.5, tBase * f));
    for (const d of [probeDir, -probeDir]) {   // good direction first; -dir returns to start
      if (state.cancel) return null;
      setMsg(`Measuring ${axis}… (${++n}/${total})`, true);
      const p = await _probe(camId, axis, tp, d, vid, ctx, gw, gh, state, capFor(tp));
      if (!p) return null;
      if (p.conf >= MIN_CONF && p.ratio >= MIN_RATIO &&
          p.normShift > 0.02 && p.normShift < 0.5) {
        const r = degOf(p.normShift) / tp;
        ratios.push(r);
        est = est ? est * 0.7 + r * 0.3 : r;   // smooth estimate for the next window
      }
    }
  }

  if (ratios.length < 3) return { error: `${axis}: too few clean samples (scene too repetitive)` };

  // ── Robust aggregate: median, then mean of samples within ±20% of it ──
  const sorted = ratios.slice().sort((a, b) => a - b);
  const median = sorted[Math.floor(sorted.length / 2)];
  const keep = ratios.filter(r => Math.abs(r - median) <= 0.2 * median);
  const dps = keep.reduce((s, r) => s + r, 0) / keep.length;
  if (!(dps > 1)) return { error: `${axis} fit failed` };
  const spread = (Math.max(...keep) - Math.min(...keep)) / dps;
  return { dps, quality: spread < 0.15 ? 'good' : 'rough' };
}

async function startAutoCalibration(cam, wrap) {
  const camId = cam.id;
  if (_autoCal[camId]) return;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    _enterCamFullscreen(wrap);
  }
  wrap._calibBtn?.classList.add('active');
  _makeBanner(wrap, camId, [{ label: 'Cancel', onClick: () => cancelAutoCalibration(camId) }]);
  const setMsg = (txt, busy) => _setCalibMsg(camId, txt, busy);

  const vid = wrap.querySelector('video-rtc')?.querySelector('video');
  if (!vid || !vid.videoWidth) {
    _finishAutoCal(cam, wrap, 'No live video to measure — is the stream up?');
    return;
  }

  const state = { cancel: false };
  _autoCal[camId] = state;

  // FOV isn't in the lightweight /cameras payload — pull the full record.
  let fovH = 90, fovV = 55;
  try {
    const all = await fetch('/api/cameras').then(r => r.json());
    const full = all.find(c => c.id === camId);
    if (full) { fovH = full.fov_h || 90; fovV = full.fov_v || 55; }
  } catch (e) { /* fall back to defaults */ }

  const out = [];
  try {
    for (const [axis, fov] of [['pan', fovH], ['tilt', fovV]]) {
      if (state.cancel) break;
      const res = await _calibrateAxisAuto(camId, fov, vid, axis, state, setMsg);
      if (state.cancel || !res) break;
      if (res.error) { out.push(res.error); continue; }
      await fetch(`/ptz/${camId}/set_axis_cal`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ axis, dps: res.dps }),
      }).catch(() => {});
      out.push(`${axis} ${res.dps.toFixed(1)}°/s${res.quality === 'rough' ? ' (rough)' : ''}`);
    }
  } catch (err) {
    console.error('Auto-cal error:', err);
    out.push('error reading video frames');
  }

  if (state.cancel) { _finishAutoCal(cam, wrap, 'Calibration cancelled.'); return; }
  _finishAutoCal(cam, wrap, out.length ? ('Saved: ' + out.join('  ·  ')) : 'Nothing measured.');
}

function _finishAutoCal(cam, wrap, msg) {
  delete _autoCal[cam.id];
  wrap._calibBtn?.classList.remove('active');
  const banner = _makeBanner(wrap, cam.id, [
    { label: 'Manual', onClick: () => { wrap.querySelector('.calib-banner')?.remove();
                                        startCalibration(cam, wrap);
                                        wrap._calibBtn?.classList.add('active'); } },
    { label: 'Close',  onClick: () => wrap.querySelector('.calib-banner')?.remove() },
  ]);
  banner.querySelector('.calib-msg').textContent = msg;
}

// Entry menu for the ⊕ button — pick Auto, Manual, or Reset-to-defaults.
function _openCalibMenu(cam, wrap) {
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    _enterCamFullscreen(wrap);
  }
  wrap._calibBtn?.classList.add('active');
  const close = () => {
    wrap.querySelector('.calib-banner')?.remove();
    wrap._calibBtn?.classList.remove('active');
  };
  const banner = _makeBanner(wrap, cam.id, [
    { label: 'Auto',   onClick: () => { wrap.querySelector('.calib-banner')?.remove();
                                        startAutoCalibration(cam, wrap); } },
    { label: 'Manual', onClick: () => { wrap.querySelector('.calib-banner')?.remove();
                                        startCalibration(cam, wrap);
                                        wrap._calibBtn?.classList.add('active'); } },
    { label: 'Reset',  onClick: () => _resetCalibration(cam) },
    { label: 'Close',  onClick: close },
  ]);
  banner.querySelector('.calib-msg').textContent = 'Calibrate aim:';
}

async function _resetCalibration(cam) {
  _setCalibMsg(cam.id, 'Resetting to defaults…', true);
  try {
    const r = await fetch(`/ptz/${cam.id}/reset_cal`, { method: 'POST' });
    _setCalibMsg(cam.id, r.ok ? 'Aim calibration reset to defaults.'
                              : 'Reset failed — check the server.', false);
  } catch (e) {
    _setCalibMsg(cam.id, 'Reset failed — check the server.', false);
  }
}

// ── Camera controls popover: absolute zoom, auto-track, guard (Reolink) ────────
// State is fetched lazily when the panel opens (each GET hits the NVR), so the
// grid load isn't slowed. Unsupported features are simply omitted.
async function _openControls(cam, wrap) {
  const panel = document.createElement('div');
  panel.className = 'ctrl-panel';
  panel.dataset.cam = cam.id;
  // Swallow events so interacting with the panel never drives PTZ/zoom/fullscreen.
  ['click', 'mousedown', 'touchstart', 'wheel', 'dblclick'].forEach(ev =>
    panel.addEventListener(ev, e => e.stopPropagation(), { passive: false }));
  panel.innerHTML = '<div class="ctrl-note">Loading…</div>';
  wrap.appendChild(panel);

  const j = (u) => fetch(u).then(r => r.json()).catch(() => ({ supported: false }));
  const [zoom, ai, guard, light, siren] = await Promise.all([
    j(`/zoom/${cam.id}/pos`), j(`/ai/${cam.id}`), j(`/guard/${cam.id}`),
    j(`/light/${cam.id}`), j(`/siren/${cam.id}`),
  ]);
  if (!wrap.contains(panel)) return;   // user closed it while loading
  panel.innerHTML = '';

  // Zoom slider
  if (zoom.supported && zoom.max > zoom.min) {
    const box = document.createElement('div');
    box.style.cssText = 'display:flex;flex-direction:column;gap:5px;';
    const head = document.createElement('div');
    head.className = 'ctrl-row';
    const lab = document.createElement('label'); lab.textContent = 'Zoom';
    const val = document.createElement('span'); val.className = 'ctrl-note';
    const slider = document.createElement('input');
    slider.type = 'range'; slider.min = zoom.min; slider.max = zoom.max; slider.value = zoom.pos;
    const pct = () => Math.round((slider.value - zoom.min) / (zoom.max - zoom.min) * 100);
    val.textContent = pct() + '%';
    slider.addEventListener('input', () => { val.textContent = pct() + '%'; });
    slider.addEventListener('change', () => {
      fetch(`/zoom/${cam.id}/pos`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pos: Number(slider.value) }),
      }).catch(() => {});
    });
    head.appendChild(lab); head.appendChild(val);
    box.appendChild(head); box.appendChild(slider);
    panel.appendChild(box);
  }

  // Generic on/off toggle row backed by a POST endpoint
  function toggleRow(labelText, url, initialOn) {
    const row = document.createElement('div'); row.className = 'ctrl-row';
    const lab = document.createElement('label'); lab.textContent = labelText;
    const tog = document.createElement('button');
    tog.className = 'ctrl-tog' + (initialOn ? ' on' : '');
    tog.textContent = initialOn ? 'On' : 'Off';
    tog.addEventListener('click', async () => {
      const want = !tog.classList.contains('on');
      tog.disabled = true;
      const r = await fetch(url, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ enable: want }),
      }).then(res => res.json()).catch(() => null);
      tog.disabled = false;
      const on = (r && r.ok) ? want : tog.classList.contains('on');
      tog.classList.toggle('on', on);
      tog.textContent = on ? 'On' : 'Off';
    });
    row.appendChild(lab); row.appendChild(tog);
    return { row, tog };
  }

  // Auto-tracking
  if (ai.supported) {
    panel.appendChild(toggleRow('Auto-track', `/ai/${cam.id}`, ai.enabled).row);
  }

  // Guard return-to-position
  if (guard.supported) {
    const { row, tog } = toggleRow('Guard return', `/guard/${cam.id}`, guard.enabled);
    panel.appendChild(row);
    const setRow = document.createElement('div'); setRow.className = 'ctrl-row';
    const note = document.createElement('span'); note.className = 'ctrl-note';
    note.textContent = guard.has_pos ? `Returns after ${guard.timeout}s` : 'No position set yet';
    const setBtn = document.createElement('button'); setBtn.className = 'ctrl-mini';
    setBtn.textContent = 'Set here';
    setBtn.title = 'Save the current view as the guard position';
    setBtn.addEventListener('click', async () => {
      setBtn.disabled = true; setBtn.textContent = 'Saving…';
      const r = await fetch(`/guard/${cam.id}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ save_pos: true, enable: true }),
      }).then(res => res.json()).catch(() => null);
      setBtn.disabled = false;
      setBtn.textContent = (r && r.ok) ? 'Saved ✓' : 'Failed';
      if (r && r.ok) { tog.classList.add('on'); tog.textContent = 'On'; note.textContent = `Returns after ${guard.timeout}s`; }
      setTimeout(() => { setBtn.textContent = 'Set here'; }, 1500);
    });
    setRow.appendChild(note); setRow.appendChild(setBtn);
    panel.appendChild(setRow);
  }

  // Floodlight (white light) — on/off + brightness
  if (light.supported && light.white) {
    const box = document.createElement('div');
    box.style.cssText = 'display:flex;flex-direction:column;gap:5px;';
    const head = document.createElement('div'); head.className = 'ctrl-row';
    const lab = document.createElement('label'); lab.textContent = 'Floodlight';
    const tog = document.createElement('button');
    tog.className = 'ctrl-tog' + (light.white.on ? ' on' : '');
    tog.textContent = light.white.on ? 'On' : 'Off';
    const slider = document.createElement('input');
    slider.type = 'range'; slider.min = 0; slider.max = 100; slider.value = light.white.bright;
    const postWhite = (body) => fetch(`/light/${cam.id}/white`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    }).catch(() => {});
    tog.addEventListener('click', async () => {
      const want = !tog.classList.contains('on');
      tog.disabled = true;
      const r = await fetch(`/light/${cam.id}/white`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ enable: want, bright: Number(slider.value) }),
      }).then(res => res.json()).catch(() => null);
      tog.disabled = false;
      const on = (r && r.ok) ? want : tog.classList.contains('on');
      tog.classList.toggle('on', on); tog.textContent = on ? 'On' : 'Off';
    });
    slider.addEventListener('change', () => {
      if (tog.classList.contains('on')) postWhite({ enable: true, bright: Number(slider.value) });
    });
    head.appendChild(lab); head.appendChild(tog);
    box.appendChild(head); box.appendChild(slider);
    panel.appendChild(box);
  }

  // Night vision (IR) — Auto / On / Off
  if (light.supported && light.ir) {
    const row = document.createElement('div'); row.className = 'ctrl-row';
    const lab = document.createElement('label'); lab.textContent = 'Night vision';
    const seg = document.createElement('div'); seg.style.cssText = 'display:flex;gap:3px;';
    ['Auto', 'On', 'Off'].forEach(st => {
      const b = document.createElement('button');
      b.className = 'ctrl-seg' + (light.ir.state === st ? ' on' : '');
      b.textContent = st;
      b.addEventListener('click', async () => {
        const r = await fetch(`/light/${cam.id}/ir`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ state: st }),
        }).then(res => res.json()).catch(() => null);
        if (r && r.ok) seg.querySelectorAll('.ctrl-seg').forEach(x => x.classList.toggle('on', x === b));
      });
      seg.appendChild(b);
    });
    row.appendChild(lab); row.appendChild(seg);
    panel.appendChild(row);
  }

  // Siren (momentary hold) — only where supported
  if (siren.supported) {
    const row = document.createElement('div'); row.className = 'ctrl-row';
    const lab = document.createElement('label'); lab.textContent = 'Siren';
    const btn = document.createElement('button');
    btn.className = 'ctrl-tog'; btn.textContent = 'Hold';
    btn.title = 'Hold to sound the siren';
    const fire = (on) => fetch(`/siren/${cam.id}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ on }),
    }).catch(() => {});
    const start = e => { e.preventDefault(); btn.classList.add('on'); fire(true); };
    const stop  = () => { btn.classList.remove('on'); fire(false); };
    btn.addEventListener('mousedown', start);
    btn.addEventListener('touchstart', start, { passive: false });
    ['mouseup', 'mouseleave', 'touchend', 'touchcancel'].forEach(ev => btn.addEventListener(ev, stop));
    row.appendChild(lab); row.appendChild(btn);
    panel.appendChild(row);
  }

  // Two-way talk (push-to-talk to the camera speaker) — Reolink cameras
  if ((cam.brand || 'reolink').toLowerCase() === 'reolink') {
    const row = document.createElement('div'); row.className = 'ctrl-row';
    const lab = document.createElement('label'); lab.textContent = 'Talk';
    const btn = document.createElement('button'); btn.className = 'ctrl-tog';
    btn.textContent = _talkEls[cam.id] ? '● Talking (tap to stop)' : 'Talk';
    if (_talkEls[cam.id]) btn.classList.add('on');
    btn.title = 'Talk through the camera speaker (needs a mic; app opened via localhost/https)';
    btn.addEventListener('click', () => {
      if (_talkEls[cam.id]) _stopTalk(cam.id, btn);
      else _startTalk(cam, btn);
    });
    row.appendChild(lab); row.appendChild(btn);
    panel.appendChild(row);
  }

  // ── "More" sub-menu: minor controls (patrol, save preset) ──
  if (cam.ptz) {
    const moreBtn = document.createElement('button');
    moreBtn.className = 'ctrl-more';
    moreBtn.textContent = 'More ▾';
    const more = document.createElement('div');
    more.style.cssText = 'display:none;flex-direction:column;gap:9px;border-top:1px solid rgba(255,255,255,.12);padding-top:9px;';
    moreBtn.addEventListener('click', () => {
      const open = more.style.display === 'flex';
      more.style.display = open ? 'none' : 'flex';
      moreBtn.textContent = open ? 'More ▾' : 'More ▴';
    });

    // Patrol / auto-cruise
    const pRow = document.createElement('div'); pRow.className = 'ctrl-row';
    const pLab = document.createElement('label'); pLab.textContent = 'Cruise';
    const pTog = document.createElement('button'); pTog.className = 'ctrl-tog'; pTog.textContent = 'Off';
    pTog.addEventListener('click', async () => {
      const want = !pTog.classList.contains('on');
      const r = await fetch(`/patrol/${cam.id}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ start: want }),
      }).then(res => res.json()).catch(() => null);
      const on = (r && r.ok) ? want : pTog.classList.contains('on');
      pTog.classList.toggle('on', on); pTog.textContent = on ? 'On' : 'Off';
    });
    pRow.appendChild(pLab); pRow.appendChild(pTog);
    more.appendChild(pRow);

    // Save current view as a preset
    const sRow = document.createElement('div'); sRow.className = 'ctrl-row';
    const sLab = document.createElement('label'); sLab.textContent = 'Save preset';
    const sBtn = document.createElement('button'); sBtn.className = 'ctrl-mini'; sBtn.textContent = 'Save here';
    sBtn.addEventListener('click', async () => {
      const name = prompt('Preset name:', '');
      if (name === null) return;
      const id = parseInt(prompt('Preset slot number (0-63):', '10'), 10);
      if (Number.isNaN(id)) return;
      sBtn.disabled = true; sBtn.textContent = 'Saving…';
      const r = await fetch(`/preset/${cam.id}/save`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, name }),
      }).then(res => res.json()).catch(() => null);
      sBtn.disabled = false; sBtn.textContent = (r && r.ok) ? 'Saved ✓' : 'Failed';
      setTimeout(() => { sBtn.textContent = 'Save here'; }, 1500);
    });
    sRow.appendChild(sLab); sRow.appendChild(sBtn);
    more.appendChild(sRow);

    panel.appendChild(moreBtn);
    panel.appendChild(more);
  }

  if (!panel.children.length) {
    panel.innerHTML = '<div class="ctrl-note">No extra controls available for this camera.</div>';
  }
}

// ── Two-way talk (push-to-talk) ───────────────────────────────────────────────
// Opens a mic-only WebRTC connection to the camera's backchannel-enabled _talk
// stream; go2rtc routes the microphone to the camera's own speaker.
const _talkEls = {};   // camId → hidden <video-rtc> while talking
function _startTalk(cam, btn) {
  if (_talkEls[cam.id]) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    // getUserMedia needs a secure context (localhost or https), not a LAN-IP http page
    btn.textContent = 'Mic needs localhost/https';
    setTimeout(() => { if (!_talkEls[cam.id]) btn.textContent = 'Talk'; }, 2500);
    return;
  }
  const el = document.createElement('video-rtc');
  el.media = 'microphone';        // send mic only → go2rtc → camera backchannel
  el.background = true;           // stay connected while hidden
  el.style.display = 'none';
  document.body.appendChild(el);
  el.src = `ws://${location.hostname}:${go2rtcPort}/api/ws?src=${cam.id}_talk`;
  _talkEls[cam.id] = el;
  btn.classList.add('on');
  btn.textContent = '● Talking (tap to stop)';
}
function _stopTalk(camId, btn) {
  const el = _talkEls[camId];
  if (el) {
    // Stop the mic track so the browser's hot-mic indicator clears, then tear down.
    try { el.pc && el.pc.getSenders().forEach(s => { try { s.track && s.track.stop(); } catch (e) {} }); } catch (e) {}
    el.remove();                  // disconnectedCallback closes the ws + pc
    delete _talkEls[camId];
  }
  if (btn) { btn.classList.remove('on'); btn.textContent = 'Talk'; }
}
function _stopAllTalk() { Object.keys(_talkEls).forEach(id => _stopTalk(id)); }
document.addEventListener('visibilitychange', () => { if (document.hidden) _stopAllTalk(); });

// ── Zoom ─────────────────────────────────────────────────────────────────────

const _digitalZoom  = {};
const _opticalQueue = {};
const _audioMuted   = {}; // camId → bool; default true (muted)


function _applyZoomTransform(overlay, vsEl, camId, scale, tx, ty) {
  // Store the overlay's LAYOUT dimensions alongside tx/ty so that if the overlay
  // later resizes (e.g. tile → fullscreen), we can scale the pixel offsets to match.
  _digitalZoom[camId] = { scale, tx, ty, w: overlay.offsetWidth, h: overlay.offsetHeight };
  vsEl.style.transformOrigin = 'center center';
  vsEl.style.transform = scale === 1 ? '' : `translate(${tx}px, ${ty}px) scale(${scale})`;
  overlay.style.cursor = scale > 1 ? 'grab' : 'crosshair';
  vsEl.parentElement?.classList.toggle('dz-pixelated', scale > 2);
}

function applyDigitalZoom(e, overlay, vsEl, camId) {
  const factor = e.deltaY < 0 ? 1.35 : (1 / 1.35);
  const state  = _digitalZoom[camId] || { scale: 1, tx: 0, ty: 0 };
  const next   = Math.max(1.0, state.scale * factor);
  if (next === state.scale) return;

  const rect = overlay.getBoundingClientRect();
  const cx = e.clientX - rect.left  - rect.width  / 2;
  const cy = e.clientY - rect.top   - rect.height / 2;

  const ratio = next / state.scale;
  let tx = cx * (1 - ratio) + state.tx * ratio;
  let ty = cy * (1 - ratio) + state.ty * ratio;

  const maxX = (next - 1) * rect.width  / 2;
  const maxY = (next - 1) * rect.height / 2;
  tx = Math.max(-maxX, Math.min(maxX, tx));
  ty = Math.max(-maxY, Math.min(maxY, ty));

  _applyZoomTransform(overlay, vsEl, camId, next, tx, ty);
}

function digitalPanStart(e, overlay, vsEl, camId, hasPtz = true) {
  if (e.button !== undefined && e.button !== 0) return;
  e.preventDefault();
  const { clientX: startX, clientY: startY } = _evClientXY(e);
  const startCoords = { clientX: startX, clientY: startY };
  const initial = _digitalZoom[camId] || { scale: 1, tx: 0, ty: 0 };
  const baseTx  = initial.tx;
  const baseTy  = initial.ty;
  let moved = false;
  overlay.style.cursor = 'grabbing';

  function onMove(ev) {
    ev.preventDefault();
    const { clientX, clientY } = _evClientXY(ev);
    const dx = clientX - startX;
    const dy = clientY - startY;
    if (!moved && Math.hypot(dx, dy) < 6) return;
    moved = true;
    const z     = _digitalZoom[camId] || initial;
    const rect  = overlay.getBoundingClientRect();
    const maxX  = (z.scale - 1) * rect.width  / 2;
    const maxY  = (z.scale - 1) * rect.height / 2;
    const tx    = Math.max(-maxX, Math.min(maxX, baseTx + dx));
    const ty    = Math.max(-maxY, Math.min(maxY, baseTy + dy));
    _applyZoomTransform(overlay, vsEl, camId, z.scale, tx, ty);
    overlay.style.cursor = 'grabbing';
  }

  function onUp() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup',   onUp);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend',  onUp);
    overlay.style.cursor = 'grab';
    if (!moved) {
      // Same double-click-to-fullscreen detection as joystickEnd —
      // first click deferred 280 ms; second click within 300 ms goes fullscreen.
      const now = Date.now();
      const ds  = _dblClickState[camId] || (_dblClickState[camId] = { t: 0, timer: null });
      if (now - ds.t < 300 && ds.timer) {
        clearTimeout(ds.timer);
        ds.timer = null;
        ds.t     = 0;
        const wrap = overlay.closest('.cam-wrap');
        if (wrap) _enterCamFullscreen(wrap);
      } else {
        ds.t = now;
        ds.timer = setTimeout(() => {
          ds.timer = null;
          ds.t     = 0;
          if (hasPtz) handlePtzClick(startCoords, overlay, camId);
        }, 280);
      }
    }
  }

  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup',   onUp);
  document.addEventListener('touchmove', onMove, { passive: false });
  document.addEventListener('touchend',  onUp);
}

function queueOpticalZoom(e, camId) {
  const dir = e.deltaY < 0 ? 1 : -1;
  if (!_opticalQueue[camId]) _opticalQueue[camId] = { dir, steps: 0, timer: null };
  const q = _opticalQueue[camId];
  if (q.dir !== dir) { q.dir = dir; q.steps = 0; }
  q.steps++;
  clearTimeout(q.timer);
  q.timer = setTimeout(async () => {
    const { dir, steps } = _opticalQueue[camId];
    delete _opticalQueue[camId];
    try {
      await fetch(`/zoom/${camId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ direction: dir, steps }),
      });
    } catch (err) { console.error('Zoom error:', err); }
  }, 120);
}

function handleScroll(e, overlay, vsEl, camId) {
  e.preventDefault();
  if (e.buttons & 2) queueOpticalZoom(e, camId);
  else applyDigitalZoom(e, overlay, vsEl, camId);
}

// Fullscreen state — track which element is fullscreened and what it was playing
// so the in-fullscreen stream toggle can restore on exit.
let _fsVsEl    = null;   // the video-rtc element currently in fullscreen
let _fsOrigSrc = null;   // stream URL it was playing when fullscreen was entered

/**
 * Switch a video-rtc element to a new stream URL without triggering the 15-second
 * reconnect timer.
 *
 * Root cause: ondisconnect() sets wsState=CLOSED and calls ws.close() (async).
 * video-rtc also listens to visibilitychange and calls connectedCallback() when the
 * document becomes visible — which happens on fullscreen entry on some systems.
 * connectedCallback() calls onconnect(), which sets wsState=CONNECTING and opens a
 * new WebSocket. When the OLD socket's close event then fires, onclose() sees
 * wsState=CONNECTING (not CLOSED), skips its guard, nulls this.ws (killing the new
 * connection) and schedules a 15-second reconnect timer.
 *
 * Fix: after ondisconnect(), immediately blank wsURL. Any spurious onconnect() calls
 * (from connectedCallback or anywhere else) fail the !this.wsURL guard and bail out.
 * We wait for the old socket's close event (at which point wsState is still CLOSED
 * and onclose() bails correctly), then set the new src — clean, no races, no timers.
 */
function _switchVideoStream(vsEl, newSrc) {
  // Cancel any stale reconnect or delayed-disconnect timers
  if (vsEl.reconnectTID)  { clearTimeout(vsEl.reconnectTID);  vsEl.reconnectTID  = 0; }
  if (vsEl.disconnectTID) { clearTimeout(vsEl.disconnectTID); vsEl.disconnectTID = 0; }

  const oldWs = vsEl.ws;   // save ref BEFORE ondisconnect() clears it
  vsEl.ondisconnect();     // wsState=CLOSED, oldWs?.close(), ws=null, pc=null

  // Blank wsURL so any spurious onconnect() (e.g. from visibilitychange →
  // connectedCallback) fails the !this.wsURL guard and does nothing.
  vsEl.wsURL = '';

  const doConnect = () => {
    // Clear any disconnectTID that may have been scheduled while we were waiting
    if (vsEl.disconnectTID) { clearTimeout(vsEl.disconnectTID); vsEl.disconnectTID = 0; }
    if (vsEl.isConnected) vsEl.src = newSrc;  // sets wsURL and calls onconnect()
  };

  if (oldWs && oldWs.readyState !== WebSocket.CLOSED) {
    // Old socket still open/closing — wait for its close event.
    // video-rtc's onclose fires first (bails because wsState=CLOSED),
    // then doConnect fires and starts the new connection cleanly.
    oldWs.addEventListener('close', doConnect, { once: true });
  } else {
    // Already closed or no prior connection — connect immediately.
    doConnect();
  }
}

// Update the [Main]/[Sub] toggle button active states to reflect what vs is playing.
// Called on fullscreen entry and after each toggle click.
function _syncFsToggle(toggle, vs) {
  const camId   = vs.dataset.camId;
  const mainSrc = `ws://${location.hostname}:${go2rtcPort}/api/ws?src=${camId}_main`;
  const onMain  = vs.wsURL === mainSrc;
  toggle.querySelector('.fs-main-btn').classList.toggle('active',  onMain);
  toggle.querySelector('.fs-sub-btn' ).classList.toggle('active', !onMain);
}

function _enterCamFullscreen(wrap) {
  // Request fullscreen FIRST — must be in the synchronous user-gesture call stack.
  if (wrap.requestFullscreen)            wrap.requestFullscreen().catch(() => {});
  else if (wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();

  // Track which element entered fullscreen and what stream it's on.
  // The stream does NOT switch automatically — whatever is playing keeps playing.
  // The in-fullscreen toggle buttons let the user switch if they want to.
  const vs = wrap.querySelector('video-rtc');
  if (vs) {
    _fsVsEl    = vs;
    _fsOrigSrc = vs.wsURL || streamSrc(vs.dataset.camId);
  }
}

function _exitFullscreen() {
  const fs = document.fullscreenElement || document.webkitFullscreenElement;
  if (fs) (document.exitFullscreen || document.webkitExitFullscreen).call(document).catch(() => {});
}

// On fullscreen entry: set the stream toggle to reflect what's currently playing.
// On fullscreen exit: if the user switched streams via the toggle, restore the
// original stream so the tile goes back to whatever was active before.
function _onFullscreenChange() {
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    // ── Entering fullscreen ──────────────────────────────────────────────────
    // Sync the toggle buttons to show the stream that's actually playing.
    const wrap = _fsVsEl?.parentElement;
    if (wrap?._fsToggle && _fsVsEl) _syncFsToggle(wrap._fsToggle, _fsVsEl);
  } else {
    // ── Exiting fullscreen ───────────────────────────────────────────────────
    // If the user toggled to a different stream while in fullscreen, restore.
    if (_fsVsEl && _fsOrigSrc && _fsVsEl.wsURL !== _fsOrigSrc) {
      _switchVideoStream(_fsVsEl, _fsOrigSrc);
    }
    _fsOrigSrc = null;
    // Exiting fullscreen cancels any in-progress aim calibration for this camera.
    const exitCamId = _fsVsEl?.dataset.camId;
    if (exitCamId && _autoCal[exitCamId]) cancelAutoCalibration(exitCamId);
    if (exitCamId && _calib[exitCamId]) {
      stopCalibration(exitCamId);
      _fsVsEl?.parentElement?._calibBtn?.classList.remove('active');
    } else if (exitCamId && !_autoCal[exitCamId]) {
      // Tidy up a lingering calibrate menu/result banner left open on exit.
      const w = _fsVsEl?.parentElement;
      w?.querySelector('.calib-banner')?.remove();
      w?._calibBtn?.classList.remove('active');
    }
    // Close the controls popover if it was left open.
    const cw = _fsVsEl?.parentElement;
    if (cw?.querySelector('.ctrl-panel') && exitCamId) _stopTalk(exitCamId);
    cw?.querySelector('.ctrl-panel')?.remove();
    cw?._ctrlBtn?.classList.remove('active');
    // NOTE: do NOT null _fsVsEl yet — the zoom block below still needs it on exit.
  }

  // Rescale zoom-pan to the overlay's NEW size.  Runs for both entry and exit:
  // the stored w/h is from the OLD size, ov.offsetWidth/Height is the NEW size.
  const camId = _fsVsEl?.dataset.camId;
  const z     = camId ? _digitalZoom[camId] : null;
  const ov    = _fsVsEl?.parentElement?._camOverlay;
  if (z && z.scale > 1 && ov && z.w && z.h) {
    _applyZoomTransform(ov, _fsVsEl, camId, z.scale,
      z.tx * (ov.offsetWidth  / z.w),
      z.ty * (ov.offsetHeight / z.h));
  }

  // Clear _fsVsEl after the zoom block has finished with it.
  if (!(document.fullscreenElement || document.webkitFullscreenElement)) {
    _fsVsEl = null;
  }
}
document.addEventListener('fullscreenchange',       _onFullscreenChange);
document.addEventListener('webkitfullscreenchange', _onFullscreenChange);
