}

function saveSnapshot(vs, camName) {
  const video = vs.querySelector('video');
  if (!video || !video.videoWidth) return;
  const canvas = document.createElement('canvas');
  canvas.width  = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    a.download = `${camName.replace(/[^a-z0-9_-]/gi, '_')}_${ts}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, 'image/png');
}

function buildCard(cam, streamDelay = 0) {
  const wrap = document.createElement('div');
  wrap.className = 'cam-wrap' + (cam.crop ? ' cam-crop' : '');
  wrap.dataset.camId = cam.id;

  const vs = document.createElement('video-rtc');
  vs.dataset.camId = cam.id;
  vs.background = _keepLive;
  vs.RECONNECT_TIMEOUT = 2000;
  // Use WebRTC with MSE as fallback.  HLS and MJPEG are excluded — they add
  // latency or bandwidth overhead not needed on a local network.  Cameras that
  // can't negotiate WebRTC (e.g. H.265 on some browsers) will fall back to MSE.
  vs.mode = 'webrtc,mse';
  wrap.appendChild(vs);
  if (streamDelay === 0) {
    vs.src = streamSrc(cam.id);
  } else {
    setTimeout(() => { if (wrap.isConnected) vs.src = streamSrc(cam.id); }, streamDelay);
  }
  monitorCard(wrap, vs);

  const label = document.createElement('div');
  label.className = 'cam-label';
  label.textContent = cam.name;
  wrap.appendChild(label);

  // Live detection badge (shown by the detection poller when this camera alerts)
  const detectBadge = document.createElement('div');
  detectBadge.className = 'detect-badge';
  wrap.appendChild(detectBadge);

  // Fullscreen button (top-right, revealed on hover)
  const fsBtn = document.createElement('button');
  fsBtn.className = 'fullscreen-btn';
  fsBtn.title = 'Full screen (Esc to exit)';
  fsBtn.innerHTML = FS_ICON;
  fsBtn.addEventListener('click', e => {
    e.stopPropagation();
    if (!document.fullscreenElement) _enterCamFullscreen(wrap);
    else document.exitFullscreen();
  });
  wrap.appendChild(fsBtn);

  // ── Double-click / double-right-click helpers (local to this card) ──────────
  let _lastRightClick = 0;
  function _onCardRightClick() {
    const now = Date.now();
    if (now - _lastRightClick < 400) _exitFullscreen();
    _lastRightClick = now;
  }

  if (cam.ptz) {
    const badge = document.createElement('div');
    badge.className = 'ptz-badge';  // CSS already places it at right:44px
    badge.textContent = 'PTZ';
    wrap.appendChild(badge);

    const reticle = document.createElement('div');
    reticle.className = 'reticle';
    wrap.appendChild(reticle);

    const overlay = document.createElement('div');
    overlay.className = 'ptz-overlay';
    wrap._camOverlay = overlay;   // stored for fullscreen zoom-pan rescaling
    overlay.addEventListener('mousedown', e => {
      const z = _digitalZoom[cam.id];
      if (z && z.scale > 1) digitalPanStart(e, overlay, vs, cam.id);
      else joystickStart(e, overlay, cam.id);
    });
    overlay.addEventListener('touchstart', e => {
      e.preventDefault();
      const z = _digitalZoom[cam.id];
      if (z && z.scale > 1) digitalPanStart(e, overlay, vs, cam.id);
      else joystickStart(e, overlay, cam.id);
    }, { passive: false });
    overlay.addEventListener('wheel', e => handleScroll(e, overlay, vs, cam.id), { passive: false });
    overlay.addEventListener('contextmenu', e => { e.preventDefault(); _onCardRightClick(); });
    wrap.appendChild(overlay);

    // Preset bar holds presets plus the calibrate & controls buttons (bottom-left)
    buildPresetBar(cam, wrap);
  } else {
    // Non-PTZ cameras get a cover overlay that catches wheel/mouse events for
    // digital zoom and pan, while still showing double-click → fullscreen.
    const cover = document.createElement('div');
    cover.style.cssText = 'position:absolute;inset:0;z-index:3;cursor:crosshair;';
    wrap._camOverlay = cover;   // stored for fullscreen zoom-pan rescaling
    wrap.appendChild(cover);

    // Scroll wheel → digital zoom
    cover.addEventListener('wheel', e => handleScroll(e, cover, vs, cam.id), { passive: false });

    // Mousedown / touchstart → digital pan when zoomed (no PTZ for non-PTZ cams)
    cover.addEventListener('mousedown', e => {
      const z = _digitalZoom[cam.id];
      if (z && z.scale > 1) { e.preventDefault(); digitalPanStart(e, cover, vs, cam.id, false); }
    });
    cover.addEventListener('touchstart', e => {
      const z = _digitalZoom[cam.id];
      if (z && z.scale > 1) { e.preventDefault(); digitalPanStart(e, cover, vs, cam.id, false); }
    }, { passive: false });

    // Double left-click → fullscreen; double right-click → exit fullscreen
    cover.addEventListener('dblclick',    e => { e.stopPropagation(); _enterCamFullscreen(wrap); });
    cover.addEventListener('contextmenu', e => { e.preventDefault(); _onCardRightClick(); });

    // Non-PTZ Reolink cams still get a controls button (floodlight / IR / siren).
    if ((cam.brand || 'reolink').toLowerCase() === 'reolink') {
      const bar = document.createElement('div');
      bar.className = 'preset-bar';
      bar.appendChild(_makeCtrlButton(cam, wrap));
      wrap.appendChild(bar);
    }
  }

  // ── In-fullscreen stream toggle ──────────────────────────────────────────────
  // Visible only when this card is fullscreened.  Lets the user switch between
  // main and sub without leaving fullscreen.  On exit the original stream restores.
  const fsToggle = document.createElement('div');
  fsToggle.className = 'fs-stream-toggle';
  wrap._fsToggle = fsToggle;

  const fsMainBtn = document.createElement('button');
  fsMainBtn.className = 'fs-stream-btn fs-main-btn';
  fsMainBtn.textContent = 'Main';
  fsMainBtn.addEventListener('click', e => {
    e.stopPropagation();
    const src = `ws://${location.hostname}:${go2rtcPort}/api/ws?src=${cam.id}_main`;
    if (vs.wsURL === src) return;
    _switchVideoStream(vs, src);
    fsMainBtn.classList.add('active');
    fsSubBtn.classList.remove('active');
  });

  const fsSubBtn = document.createElement('button');
  fsSubBtn.className = 'fs-stream-btn fs-sub-btn';
  fsSubBtn.textContent = 'Sub';
  fsSubBtn.addEventListener('click', e => {
    e.stopPropagation();
    const src = `ws://${location.hostname}:${go2rtcPort}/api/ws?src=${cam.id}_sub`;
    if (vs.wsURL === src) return;
    _switchVideoStream(vs, src);
    fsSubBtn.classList.add('active');
    fsMainBtn.classList.remove('active');
  });

  fsToggle.appendChild(fsMainBtn);
  fsToggle.appendChild(fsSubBtn);
  wrap.appendChild(fsToggle);

  const snapBtn = document.createElement('button');
  snapBtn.className = 'snap-btn';
  snapBtn.title = 'Save snapshot';
  snapBtn.innerHTML = SNAP_ICON;
  snapBtn.addEventListener('click', e => { e.stopPropagation(); saveSnapshot(vs, cam.name); });
  wrap.appendChild(snapBtn);

  // Initialise audio state — default muted, survive view switches via _audioMuted map
  if (_audioMuted[cam.id] === undefined) _audioMuted[cam.id] = true;
  const isMuted = _audioMuted[cam.id];

  const audioBtn = document.createElement('button');
  audioBtn.className = 'audio-btn';
  audioBtn.innerHTML = isMuted ? MUTE_ICON : UNMUTE_ICON;
  audioBtn.title = isMuted ? 'Unmute audio' : 'Mute audio';
  audioBtn.addEventListener('click', e => {
    e.stopPropagation();
    const nowMuted = !_audioMuted[cam.id];
    _audioMuted[cam.id] = nowMuted;
    const vid = vs.querySelector('video');
    if (vid) vid.muted = nowMuted;
    audioBtn.innerHTML = nowMuted ? MUTE_ICON : UNMUTE_ICON;
    audioBtn.title = nowMuted ? 'Unmute audio' : 'Mute audio';
  });
  wrap.appendChild(audioBtn);

  // MutationObserver: fires once when VideoRTC appends its internal <video>.
  // Sets controls=false, applies the persisted mute state, and attaches a live-edge
  // enforcer to prevent the stall → fast-catchup pattern.
  //
  // Root cause of stalling: the browser accumulates a playback buffer that drifts
  // behind the live edge of the WebRTC stream.  The video appears frozen until the
  // buffer is flushed, then jumps forward.  Fix: on every timeupdate, if currentTime
  // has fallen more than 500 ms behind buffered.end, seek back to near-live.
  const _vidObs = new MutationObserver(() => {
    const vid = vs.querySelector('video');
    if (!vid) return;
    vid.controls = false;
    vid.muted = _audioMuted[cam.id] !== false;

    // Stall recovery for WebRTC mode.
    //
    // In WebRTC mode video.srcObject is a MediaStream — video.buffered is always
    // empty so timeupdate-based buffer checks are useless.  Instead we watch for
    // the 'waiting' event (fires when the decoder pipeline backs up) and reattach
    // srcObject, which tells the video element to discard queued frames and
    // restart from the latest one received.  A 400 ms debounce avoids false
    // triggers on normal keyframe gaps.
    let _stallTID = null;
    vid.addEventListener('waiting', () => {
      clearTimeout(_stallTID);
      _stallTID = setTimeout(() => {
        if (vid.paused) return;
        const stream = vid.srcObject;
        if (stream instanceof MediaStream) {
          // Reattach to flush the stale frame pipeline and resume at live edge
          vid.srcObject = null;
          vid.srcObject = stream;
          vid.play().catch(() => {});
        } else if (vid.buffered.length) {
          // MSE fallback: seek to near live edge
          vid.currentTime = vid.buffered.end(vid.buffered.length - 1) - 0.05;
        }
      }, 400);
    });
    vid.addEventListener('playing', () => clearTimeout(_stallTID));

    _vidObs.disconnect();
  });
  _vidObs.observe(vs, { childList: true, subtree: true });

  return wrap;
}

// Creates the camera-controls (⋮≡) button; used on both PTZ and non-PTZ Reolink cards.
function _makeCtrlButton(cam, wrap) {
  const ctrlBtn = document.createElement('button');
  ctrlBtn.className = 'ctrl-btn';
  ctrlBtn.title = 'Camera controls';
  ctrlBtn.innerHTML = CTRL_ICON;
  ctrlBtn.addEventListener('click', e => {
    e.stopPropagation();
    const open = wrap.querySelector('.ctrl-panel');
    if (open) { open.remove(); ctrlBtn.classList.remove('active'); _stopTalk(cam.id); }
    else { ctrlBtn.classList.add('active'); _openControls(cam, wrap); }
  });
  wrap._ctrlBtn = ctrlBtn;
  return ctrlBtn;
}

function buildPresetBar(cam, wrap) {
  // Built synchronously so the calibrate/controls buttons appear immediately;
  // presets are fetched after and inserted to the right of them.
  const bar = document.createElement('div');
  bar.className = 'preset-bar';

  // ── Left: calibrate + controls icon buttons ──
  const calibBtn = document.createElement('button');
  calibBtn.className = 'calib-btn';
  calibBtn.title = 'Calibrate click-to-centre aim';
  calibBtn.innerHTML = CALIB_ICON;
  calibBtn.addEventListener('click', e => {
    e.stopPropagation();
    if (_autoCal[cam.id]) { cancelAutoCalibration(cam.id); }
    else if (_calib[cam.id]) { stopCalibration(cam.id); calibBtn.classList.remove('active'); }
    else { _openCalibMenu(cam, wrap); }
  });
  wrap._calibBtn = calibBtn;
  bar.appendChild(calibBtn);
  bar.appendChild(_makeCtrlButton(cam, wrap));

  wrap.appendChild(bar);

  // ── Right: presets (loaded async, appended after the icon buttons) ──
  async function clickPreset(btn, camId, presetId) {
    btn.classList.remove('failed');
    try {
      const data = await fetch(`/preset/${camId}/${presetId}`, { method: 'POST' }).then(r => r.json());
      if (data.ok) return;
    } catch { /* fall through to fail flash */ }
    void btn.offsetWidth;
    btn.classList.add('failed');
    btn.addEventListener('animationend', () => btn.classList.remove('failed'), { once: true });
  }

  fetch(`/presets/${cam.id}`).then(r => r.json()).then(presets => {
    (presets || []).slice(0, 4).forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'preset-btn';
      btn.textContent = p.name;
      btn.title = `Go to preset: ${p.name}`;
      btn.addEventListener('click', e => { e.stopPropagation(); clickPreset(btn, cam.id, p.id); });
      bar.appendChild(btn);
    });
    if (cam.monitor_preset != null) {
      const btn = document.createElement('button');
      btn.className = 'preset-btn monitor';
      btn.textContent = 'Monitor';
      btn.title = 'Return to monitor position';
      btn.addEventListener('click', e => { e.stopPropagation(); clickPreset(btn, cam.id, cam.monitor_preset); });
      bar.appendChild(btn);
    }
  }).catch(() => {});
}

// ── Server-offline detection ──────────────────────────────────────────────────

let _serverOfflineCount = 0;    // consecutive network-error failures
let _serverOfflineTimer = null; // auto-retry interval while overlay is shown

function _showServerOffline() {
  document.getElementById('server-offline').classList.add('visible');
  document.getElementById('server-offline-status').textContent = 'Checking every 5 seconds…';
  if (!_serverOfflineTimer) {
    _serverOfflineTimer = setInterval(retryServerConnection, 5000);
  }
}

function _hideServerOffline() {
  document.getElementById('server-offline').classList.remove('visible');
  if (_serverOfflineTimer) { clearInterval(_serverOfflineTimer); _serverOfflineTimer = null; }
  _serverOfflineCount = 0;
}

async function retryServerConnection() {
  const statusEl = document.getElementById('server-offline-status');
  if (statusEl) statusEl.textContent = 'Checking…';
  try {
    await fetch('/api/auth/status', { cache: 'no-store' });
    // Server responded — reload to get a clean fresh state
    location.reload();
  } catch {
    if (statusEl) statusEl.textContent = 'Still offline — retrying…';
  }
}

// Immediate check when user returns to the tab while overlay is showing
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && document.getElementById('server-offline').classList.contains('visible')) {
    retryServerConnection();
  }
});

// ── go2rtc health & stream monitoring ────────────────────────────────────────

async function checkGo2rtcHealth() {
  const dot = document.getElementById('rtc-status');
  try {
    const h = await fetch('/api/go2rtc/health').then(r => r.json());
    // Server responded — clear any offline state
    _serverOfflineCount = 0;
    _hideServerOffline();
    if (h.alive && h.api_ok) {
      dot.className = 'ok';
      dot.title = `Stream engine running — ${h.streams.length} stream(s) registered`;
    } else {
      dot.className = 'err';
      const reason = !h.alive ? 'process not running' : 'API not responding';
      dot.title = `Stream engine offline (${reason}) — click to restart`;
      // Auto-restart with 60s cooldown shared across all tabs via localStorage,
      // preventing a restart storm when multiple tabs are open simultaneously.
      const now = Date.now();
      const lastRestart = parseInt(localStorage.getItem('go2rtcLastRestart') || '0');
      if (now - lastRestart > 60000) {
        localStorage.setItem('go2rtcLastRestart', String(now));
        console.warn('[go2rtc] dead/unresponsive — auto-restarting');
        await fetch('/api/go2rtc/restart', { method: 'POST' }).catch(() => {});
        await new Promise(r => setTimeout(r, 2500));
        renderGrid();
        await checkGo2rtcHealth();
        return h;
      }
    }
    if (h.recent_errors && h.recent_errors.length) {
      console.warn('[go2rtc errors]', h.recent_errors.join('\n'));
    }
    if (h.log_tail && h.log_tail.length) {
      console.debug('[go2rtc log]', h.log_tail.join('\n'));
    }
    return h;
  } catch (e) {
    // TypeError = network-level failure (server not running / connection refused)
    // Two consecutive failures required to avoid a false alarm on a single blip
    if (e instanceof TypeError) {
      _serverOfflineCount++;
      if (_serverOfflineCount >= 2) _showServerOffline();
    } else {
      dot.className = '';
      dot.title = 'Stream engine status unknown';
    }
    return null;
  }
}

async function reconnectStreams() {
  const dot = document.getElementById('rtc-status');
  dot.className = '';
  dot.title = 'Restarting…';
  try {
    await fetch('/api/go2rtc/restart', { method: 'POST' });
  } catch (e) { /* ignore */ }
  // Give go2rtc 2s to come back up then re-render to reconnect video-rtc elements
  await new Promise(r => setTimeout(r, 2500));
  renderGrid();
  await checkGo2rtcHealth();
}

// Per-camera reconnect: bounce just this stream's src unless the engine is dead,
// in which case fall back to a full go2rtc restart. Avoids dropping everyone else's
// streams when a single camera has a network hiccup.
async function reconnectCamera(vs) {
  const savedSrc = vs.src;
  try {
    const h = await fetch('/api/go2rtc/health').then(r => r.json());
    if (!h.alive || !h.api_ok) {
      reconnectStreams();
    } else {
      vs.src = null;
      setTimeout(() => { if (vs.isConnected) vs.src = savedSrc; }, 400);
    }
  } catch {
    reconnectStreams();
  }
}

function monitorCard(wrap, vs) {
  const timer = setInterval(() => {
    if (!wrap.isConnected) { clearInterval(timer); return; }
    const video = vs.querySelector('video');
    const hasVideo = video && video.videoWidth > 0;
    const existing = wrap.querySelector('.stream-offline');
    if (hasVideo) {
      existing?.remove();
    } else if (!existing) {
      const div = document.createElement('div');
      div.className = 'stream-offline';
      const offlineMsg = document.createElement('span');
      offlineMsg.textContent = '⚠ Stream offline';
      const reconnBtn = document.createElement('button');
      reconnBtn.textContent = 'Reconnect';
      reconnBtn.addEventListener('click', () => { div.remove(); reconnectCamera(vs); });
      div.appendChild(offlineMsg);
      div.appendChild(reconnBtn);
      wrap.appendChild(div);
    }
  }, 5000);
}

// ── Init ─────────────────────────────────────────────────────────────────────

async function init() {
  await customElements.whenDefined('video-rtc');
  applyTheme(localStorage.getItem('theme') === 'light');
  fetch('/api/version').then(r => r.json()).then(d => {
    document.getElementById('app-version').textContent = `v${d.version}`;
  }).catch(() => {});
  const camResp = await fetch('/cameras');
  if (camResp.status === 401) {
    // Session expired (e.g. server restarted) — browser may have served cached HTML.
    // Redirect to login and come back here after re-auth.
    location.href = '/login.html?next=' + encodeURIComponent(location.pathname + location.search);
    return;
  }
  const cameras = await camResp.json();
  const n = cameras.length;

  if (n > 0) go2rtcPort = cameras[0].go2rtc_port;
  document.getElementById('cam-count').textContent = `${n} camera${n !== 1 ? 's' : ''}`;

  // Build layout buttons
  const layoutContainer = document.getElementById('layout-btns');
  LAYOUTS.forEach(layout => {
    const btn = document.createElement('button');
    btn.textContent = layout.label;
    btn.dataset.layout = layout.label;
    btn.addEventListener('click', () => setLayout(layout));
    layoutContainer.appendChild(btn);
  });

  _cameras       = cameras;
  _pageGroups    = computePageGroups(cameras);
  _useNamedPages = cameras.some(c => c.page);
  _groupIdx      = 0;
  const firstGroupSize = _useNamedPages ? (_pageGroups[0]?.cameras.length ?? n) : n;
  _layout = defaultLayout(firstGroupSize);

  document.querySelectorAll('#layout-btns button').forEach(b => {
    b.classList.toggle('active', b.dataset.layout === _layout.label);
  });

  _labelsVisible = localStorage.getItem('labels') !== '0';
  if (!_labelsVisible) {
    document.getElementById('grid').classList.add('hide-labels');
    const btn = document.getElementById('labels-btn');
    if (btn) { btn.title = 'Show camera labels'; btn.style.opacity = '0.5'; }
  }

  _keepLive = localStorage.getItem('keepLive') === '1';
  if (_keepLive) {
    const btn = document.getElementById('keeplive-btn');
    if (btn) {
      btn.classList.add('active');
      btn.title = 'Streams stay live when tab is hidden (click to disable)';
    }
  }

  renderGrid();

  if (window._isMobile) {
    setLayout(LAYOUTS[0]);
    applyMobileUI();  // re-run after layout buttons exist so stream-btns sizes apply
  }

  await checkGo2rtcHealth();
  setInterval(checkGo2rtcHealth, 15000);
}

init().catch(console.error);

// ── Mobile UI ─────────────────────────────────────────────────────────────────

function toggleMobileMenu() {
  const menu    = document.getElementById('mob-menu');
  const overlay = document.getElementById('mob-menu-overlay');
  const open    = !menu.classList.contains('open');
  menu.classList.toggle('open', open);
  overlay.classList.toggle('open', open);
  if (open) _syncMobLayoutBtns();
}

function _syncMobLayoutBtns() {
  const container = document.getElementById('mob-layout-btns');
  if (!container) return;
  container.innerHTML = '';
  LAYOUTS.forEach(layout => {
    const btn = document.createElement('button');
    btn.textContent = layout.label;
    btn.classList.toggle('active', layout.label === _layout.label);
    btn.onclick = () => { setLayout(layout); toggleMobileMenu(); };
    container.appendChild(btn);
  });
}

function applyMobileUI() {
  // Show hamburger
  const hamburger = document.getElementById('mob-hamburger');
  if (hamburger) hamburger.style.setProperty('display', 'flex', 'important');

  // Show bottom nav
  const mobileNav = document.getElementById('mobile-nav');
  if (mobileNav) mobileNav.style.setProperty('display', 'flex', 'important');

  // Shrink body height so grid doesn't extend behind the fixed bottom nav
  document.body.style.paddingBottom = 'calc(64px + env(safe-area-inset-bottom, 0px))';

  // Hide desktop-only header items
  ['cam-count', 'layout-btns', 'nav-btns', 'rtc-status',
   'fullscreen-grid-btn', 'labels-btn', 'keeplive-btn',
   'theme-btn', 'settings-btn']
    .forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.setProperty('display', 'none', 'important');
    });

  // Compact header and stream buttons for mobile
  const header = document.querySelector('header');
  if (header) { header.style.padding = '6px 10px'; header.style.gap = '8px'; }
  document.querySelectorAll('#stream-btns button').forEach(b => {
    b.style.padding = '5px 12px'; b.style.fontSize = '0.8rem';
  });
}

(function detectMobile() {
  // In standalone (app window / PWA) mode, always use the desktop UI layout
  if (window.matchMedia('(display-mode: standalone)').matches) return;
  const isMobile = 'ontouchstart' in window
    || navigator.maxTouchPoints > 0
    || window.screen.width < 1200
    || window.innerWidth < 1000;
  if (!isMobile) return;
  window._isMobile = true;
  applyMobileUI();
})();
</script>
