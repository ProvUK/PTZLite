<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PTZLite</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <script type="module">
    import { VideoRTC } from '/video-rtc.js';
    customElements.define('video-rtc', VideoRTC);
  </script>
  <style>
    :root {
      --bg:         #0d0d0d;
      --surface:    #161616;
      --surface2:   #222;
      --border:     #2a2a2a;
      --border2:    #333;
      --text:       #e0e0e0;
      --text-muted: #666;
      --text-btn:   #aaa;
      --cam-bg:     #111;
    }
    .light {
      --bg:         #f2f4f7;
      --surface:    #ffffff;
      --surface2:   #e8eaed;
      --border:     #d4d8de;
      --border2:    #c0c5cc;
      --text:       #1a1a1a;
      --text-muted: #888;
      --text-btn:   #555;
      --cam-bg:     #d8dce2;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    header h1 { font-size: 1rem; font-weight: 600; letter-spacing: 0.02em; }
    #cam-count { font-size: 0.78rem; color: var(--text-muted); }

    #stream-btns, #layout-btns, #nav-btns {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    #layout-btns { margin-left: auto; }

    #stream-btns button,
    #layout-btns button,
    #nav-btns button {
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--text-btn);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    #stream-btns button:hover,   #stream-btns button.active,
    #layout-btns button:hover,   #layout-btns button.active,
    #nav-btns button:hover { background: #2563eb; color: #fff; border-color: #2563eb; }

    #nav-btns button:disabled { opacity: 0.3; cursor: default; pointer-events: none; }
    #nav-btns button { padding: 4px 8px; }
    #page-info { font-size: 0.72rem; color: var(--text-muted); min-width: 36px; text-align: center; }

    #settings-btn, #theme-btn, #about-btn, #help-btn {
      display: flex; align-items: center; justify-content: center;
      width: 30px; height: 30px;
      background: var(--surface2); border: 1px solid var(--border2); border-radius: 4px;
      color: var(--text-btn); text-decoration: none; cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    #settings-btn:hover, #theme-btn:hover, #about-btn:hover, #help-btn:hover { background: #2563eb; color: #fff; border-color: #2563eb; }

    #grid {
      flex: 1;
      display: grid;
      gap: 3px;
      padding: 3px;
      overflow: hidden;
    }

    .cam-wrap {
      position: relative;
      background: var(--cam-bg);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
    }

    .cam-wrap video-rtc {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }
    .cam-wrap video-rtc video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Fullscreen mode */
    .cam-wrap:fullscreen         { background: #000; }
    .cam-wrap:-webkit-full-screen { background: #000; }
    .cam-wrap:fullscreen video-rtc,
    .cam-wrap:-webkit-full-screen video-rtc { width: 100vw; height: 100vh; }

    .cam-label {
      position: absolute;
      top: 7px; left: 9px;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(4px);
      color: #eee;
      font-size: 0.72rem;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 4px;
      pointer-events: none;
      user-select: none;
      z-index: 2;
    }

    .ptz-badge {
      position: absolute;
      top: 7px; right: 44px;
      background: #2563eb; color: #fff;
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em;
      padding: 3px 7px; border-radius: 4px;
      pointer-events: none;
      z-index: 2;
    }

    /* Fullscreen button — top-right of every card, visible on hover */
    .fullscreen-btn {
      position: absolute;
      top: 7px; right: 9px;
      z-index: 8;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 4px;
      color: #aaa;
      cursor: pointer;
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      padding: 0;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s;
    }
    .cam-wrap:hover .fullscreen-btn       { opacity: 1; }
    .cam-wrap:fullscreen .fullscreen-btn,
    .cam-wrap:-webkit-full-screen .fullscreen-btn { opacity: 1; }
    .fullscreen-btn:hover { color: #fff; border-color: rgba(255,255,255,.4); }

    /* PTZ overlay */
    .ptz-overlay {
      position: absolute;
      inset: 0;
      cursor: crosshair;
      z-index: 3;
    }

    .reticle {
      position: absolute;
      top: 50%; left: 50%;
      width: 22px; height: 22px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 4;
    }
    .reticle::before, .reticle::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.35);
    }
    .reticle::before { width: 1px; height: 100%; left: 50%; }
    .reticle::after  { height: 1px; width: 100%; top: 50%; }

    .ripple {
      position: absolute;
      width: 36px; height: 36px;
      border: 2px solid rgba(255,255,255,0.9);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.3);
      animation: ripple-out 0.45s ease-out forwards;
      z-index: 5;
    }
    @keyframes ripple-out {
      to { transform: translate(-50%, -50%) scale(1.8); opacity: 0; }
    }

    .preset-bar {
      position: absolute;
      bottom: 7px; left: 9px; right: 9px;
      display: flex; gap: 4px; flex-wrap: wrap;
      z-index: 5;
      pointer-events: none;
    }
    .preset-btn {
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(4px);
      color: #ddd;
      font-size: 0.65rem; font-weight: 600; letter-spacing: 0.04em;
      padding: 3px 9px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 4px;
      cursor: pointer;
      pointer-events: all;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .preset-btn:hover { background: rgba(37,99,235,.85); color: #fff; border-color: #2563eb; }
    .preset-btn.monitor { border-color: rgba(250,204,21,.4); color: #fcd34d; }
    .preset-btn.monitor:hover { background: rgba(161,98,7,.85); border-color: #ca8a04; }
    .preset-btn.failed { animation: preset-fail 0.6s ease-out forwards; }
    @keyframes preset-fail {
      0%   { background: rgba(220,38,38,.85); border-color: #dc2626; color: #fff; }
      100% { background: rgba(0,0,0,.65); border-color: rgba(255,255,255,.15); color: #ddd; }
    }

    .joystick-ring {
      position: absolute;
      width: 120px; height: 120px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 6;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.25);
    }
    .joystick-knob {
      position: absolute;
      width: 20px; height: 20px;
      background: rgba(255,255,255,0.85);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 7;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    /* go2rtc status dot */
    #rtc-status {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #555;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.4s;
      title: 'Stream engine';
    }
    #rtc-status.ok  { background: #22c55e; }
    #rtc-status.err { background: #ef4444; box-shadow: 0 0 6px #ef4444; }

    /* Per-card stream-offline overlay */
    .stream-offline {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.55);
      z-index: 9;
      gap: 10px;
      pointer-events: none;
    }
    .stream-offline span { color: #fca5a5; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.03em; }
    .stream-offline button {
      pointer-events: all;
      background: #1e3a5f; border: 1px solid #2563eb; color: #93c5fd;
      border-radius: 4px; padding: 4px 14px; font-size: 0.72rem; cursor: pointer;
    }
    .stream-offline button:hover { background: #2563eb; color: #fff; }
  </style>
</head>
<body>

<header>
  <h1><img src="/main-logo.png" alt="PTZLite" style="height:2em;vertical-align:middle"> <span id="app-version" style="font-size:0.45em;font-weight:400;opacity:0.6;vertical-align:middle"></span></h1>
  <span id="cam-count"></span>
  <div id="stream-btns">
    <button data-stream="main" class="active">Main</button>
    <button data-stream="sub">Sub</button>
  </div>
  <div id="layout-btns"></div>
  <div id="nav-btns" style="display:none">
    <button id="prev-btn" onclick="changePage(-1)">&#8249;</button>
    <span id="page-info"></span>
    <button id="next-btn" onclick="changePage(1)">&#8250;</button>
  </div>
  <div id="rtc-status" title="Stream engine — click to reconnect" onclick="reconnectStreams()"></div>
  <a href="/about.html" id="about-btn" title="About PTZLite">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
  </a>
  <a href="/help.html" id="help-btn" title="Help">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
  </a>
  <button id="theme-btn" title="Toggle light/dark mode" onclick="toggleTheme()">
    <svg id="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
  </button>
  <a href="/settings.html" id="settings-btn" title="Camera setup">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </a>
</header>
<div id="grid"></div>

<script>
// ── Stream state ─────────────────────────────────────────────────────────────

let activeStream = 'main';
let go2rtcPort   = 1984;

function streamSrc(camId) {
  return `ws://${location.hostname}:${go2rtcPort}/api/ws?src=${camId}_${activeStream}`;
}

function setStream(stream) {
  if (stream === activeStream) return;
  activeStream = stream;
  document.querySelectorAll('#stream-btns button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.stream === stream);
  });
  renderGrid(); // destroy + recreate elements — reliable reconnect
}

// ── Theme ─────────────────────────────────────────────────────────────────────
const MOON_ICON = `<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>`;
const SUN_ICON  = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`;

function applyTheme(light) {
  document.body.classList.toggle('light', light);
  document.getElementById('theme-icon').innerHTML = light ? SUN_ICON : MOON_ICON;
  document.getElementById('theme-btn').title = light ? 'Switch to dark mode' : 'Switch to light mode';
}

function toggleTheme() {
  const light = !document.body.classList.contains('light');
  localStorage.setItem('theme', light ? 'light' : 'dark');
  applyTheme(light);
}

document.getElementById('stream-btns').addEventListener('click', e => {
  const btn = e.target.closest('button[data-stream]');
  if (btn) setStream(btn.dataset.stream);
});

// ── Layout & pagination ───────────────────────────────────────────────────────

const LAYOUTS = [
  { label: '1×1', cols: 1, rows: 1 },
  { label: '2×1', cols: 2, rows: 1 },
  { label: '2×2', cols: 2, rows: 2 },
  { label: '3×2', cols: 3, rows: 2 },
  { label: '3×3', cols: 3, rows: 3 },
  { label: '4×4', cols: 4, rows: 4 },
];

let _layout  = LAYOUTS[2];
let _page    = 0;
let _cameras = [];

function perPage()   { return _layout.cols * _layout.rows; }
function pageCount() { return Math.max(1, Math.ceil(_cameras.length / perPage())); }

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';  // destroys existing video-rtc elements → stops streams
  grid.style.gridTemplateColumns = `repeat(${_layout.cols}, 1fr)`;
  grid.style.gridTemplateRows    = `repeat(${_layout.rows}, 1fr)`;

  const start = _page * perPage();
  const slice = _cameras.slice(start, start + perPage());
  slice.forEach(cam => grid.appendChild(buildCard(cam)));

  // Empty slots so grid shape is always preserved
  for (let i = slice.length; i < perPage(); i++) {
    const empty = document.createElement('div');
    empty.className = 'cam-wrap';
    grid.appendChild(empty);
  }

  // Pagination nav
  const pc = pageCount();
  const navEl = document.getElementById('nav-btns');
  navEl.style.display = pc > 1 ? '' : 'none';
  document.getElementById('prev-btn').disabled = _page === 0;
  document.getElementById('next-btn').disabled = _page >= pc - 1;
  document.getElementById('page-info').textContent = `${_page + 1} / ${pc}`;
}

function setLayout(layout) {
  _layout = layout;
  _page   = 0;
  renderGrid();
  document.querySelectorAll('#layout-btns button').forEach(b => {
    b.classList.toggle('active', b.dataset.layout === layout.label);
  });
}

function changePage(delta) {
  _page = Math.max(0, Math.min(pageCount() - 1, _page + delta));
  renderGrid();
}

function defaultLayout(n) {
  if (n <= 1) return LAYOUTS[0];
  if (n <= 2) return LAYOUTS[1];
  if (n <= 4) return LAYOUTS[2];
  if (n <= 6) return LAYOUTS[3];
  if (n <= 9) return LAYOUTS[4];
  return LAYOUTS[5];
}

// ── PTZ Joystick ─────────────────────────────────────────────────────────────

const JOYSTICK_MAX_PX   = 60;
const JOYSTICK_DEAD_PX  =  8;
const JOYSTICK_CLICK_PX =  6;
const JOYSTICK_RATE_MS  = 80;

const _joysticks = {};

function joystickStart(e, overlay, camId) {
  if (e.button !== 0) return;
  e.preventDefault();

  const rect = overlay.getBoundingClientRect();
  const ox = e.clientX - rect.left;
  const oy = e.clientY - rect.top;

  const ring = document.createElement('div');
  ring.className = 'joystick-ring';
  ring.style.left = `${ox}px`;
  ring.style.top  = `${oy}px`;
  overlay.appendChild(ring);

  const knob = document.createElement('div');
  knob.className = 'joystick-knob';
  knob.style.left = `${ox}px`;
  knob.style.top  = `${oy}px`;
  overlay.appendChild(knob);

  const state = {
    active: true,
    originX: e.clientX, originY: e.clientY,
    overlayLeft: rect.left, overlayTop: rect.top,
    ox, oy,
    ring, knob,
    moved: false,
    wasMoving: false,
    lastX: 0, lastY: 0,
    timer: null,
    startEvent: e,
  };
  _joysticks[camId] = state;

  function onMove(ev) { if (state.active) joystickMove(ev, state, camId); }
  function onUp(ev)   {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup',   onUp);
    joystickEnd(ev, overlay, state, camId);
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup',   onUp);
}

function joystickMove(e, state, camId) {
  const dx = e.clientX - state.originX;
  const dy = e.clientY - state.originY;
  const dist = Math.hypot(dx, dy);

  if (dist > JOYSTICK_CLICK_PX) state.moved = true;

  const clamped = Math.min(dist, JOYSTICK_MAX_PX);
  const angle   = Math.atan2(dy, dx);
  state.knob.style.left = `${state.ox + Math.cos(angle) * clamped}px`;
  state.knob.style.top  = `${state.oy + Math.sin(angle) * clamped}px`;

  if (dist < JOYSTICK_DEAD_PX) {
    state.lastX = 0; state.lastY = 0;
    if (state.wasMoving) {
      state.wasMoving = false;
      fetch(`/ptz/${camId}/stop`, { method: 'POST' }).catch(() => {});
    }
    return;
  }

  const mag  = clamped / JOYSTICK_MAX_PX;
  state.lastX = Math.cos(angle) * mag;
  state.lastY = Math.sin(angle) * mag;
  state.wasMoving = true;

  if (state.timer) return;
  state.timer = setTimeout(() => {
    state.timer = null;
    if (state.active && state.wasMoving) {
      fetch(`/ptz/${camId}/start`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ x: state.lastX, y: state.lastY }),
      }).catch(() => {});
    }
  }, JOYSTICK_RATE_MS);
}

function joystickEnd(e, overlay, state, camId) {
  state.active = false;
  if (state.timer) { clearTimeout(state.timer); state.timer = null; }
  state.ring.remove();
  state.knob.remove();
  delete _joysticks[camId];

  if (!state.moved) {
    handlePtzClick(state.startEvent, overlay, camId);
    return;
  }
  fetch(`/ptz/${camId}/stop`, { method: 'POST' }).catch(() => {});
}

// ── PTZ click ─────────────────────────────────────────────────────────────────

function showRipple(overlay, x, y) {
  const r = document.createElement('div');
  r.className = 'ripple';
  r.style.left = `${x * 100}%`;
  r.style.top  = `${y * 100}%`;
  overlay.appendChild(r);
  r.addEventListener('animationend', () => r.remove(), { once: true });
}

async function handlePtzClick(e, overlay, camId) {
  const rect = overlay.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const y = (e.clientY - rect.top)  / rect.height;
  showRipple(overlay, x, y);
  try {
    await fetch(`/ptz/${camId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ x, y }),
    });
  } catch (err) { console.error('PTZ error:', err); }
}

// ── Zoom ─────────────────────────────────────────────────────────────────────

const _digitalZoom  = {};
const _opticalQueue = {};

function applyDigitalZoom(e, overlay, vsEl, camId) {
  const factor = e.deltaY < 0 ? 1.12 : (1 / 1.12);
  const state  = _digitalZoom[camId] || { scale: 1, tx: 0, ty: 0 };
  const next   = Math.max(1.0, Math.min(8.0, state.scale * factor));
  if (next === state.scale) return;

  const rect = overlay.getBoundingClientRect();
  const cx = e.clientX - rect.left  - rect.width  / 2;
  const cy = e.clientY - rect.top   - rect.height / 2;

  const ratio = next / state.scale;
  let tx = cx * (1 - ratio) + state.tx * ratio;
  let ty = cy * (1 - ratio) + state.ty * ratio;

  const maxX = (next - 1) * rect.width  / 2;
  const maxY = (next - 1) * rect.height / 2;
  tx = Math.max(-maxX, Math.min(maxX, tx));
  ty = Math.max(-maxY, Math.min(maxY, ty));

  _digitalZoom[camId] = { scale: next, tx, ty };
  vsEl.style.transformOrigin = 'center center';
  vsEl.style.transform = next === 1 ? '' : `translate(${tx}px, ${ty}px) scale(${next})`;
}

function queueOpticalZoom(e, camId) {
  const dir = e.deltaY < 0 ? 1 : -1;
  if (!_opticalQueue[camId]) _opticalQueue[camId] = { dir, steps: 0, timer: null };
  const q = _opticalQueue[camId];
  if (q.dir !== dir) { q.dir = dir; q.steps = 0; }
  q.steps++;
  clearTimeout(q.timer);
  q.timer = setTimeout(async () => {
    const { dir, steps } = _opticalQueue[camId];
    delete _opticalQueue[camId];
    try {
      await fetch(`/zoom/${camId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ direction: dir, steps }),
      });
    } catch (err) { console.error('Zoom error:', err); }
  }, 120);
}

function handleScroll(e, overlay, vsEl, camId) {
  e.preventDefault();
  if (e.buttons & 2) queueOpticalZoom(e, camId);
  else applyDigitalZoom(e, overlay, vsEl, camId);
}

// ── Build camera card ─────────────────────────────────────────────────────────

const FS_ICON = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
  <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
</svg>`;

function buildCard(cam) {
  const wrap = document.createElement('div');
  wrap.className = 'cam-wrap';

  const vs = document.createElement('video-rtc');
  vs.dataset.camId = cam.id;
  wrap.appendChild(vs);
  vs.src = streamSrc(cam.id);
  monitorCard(wrap, vs);

  const label = document.createElement('div');
  label.className = 'cam-label';
  label.textContent = cam.name;
  wrap.appendChild(label);

  // Fullscreen button (top-right, revealed on hover)
  const fsBtn = document.createElement('button');
  fsBtn.className = 'fullscreen-btn';
  fsBtn.title = 'Full screen (Esc to exit)';
  fsBtn.innerHTML = FS_ICON;
  fsBtn.addEventListener('click', e => {
    e.stopPropagation();
    if (!document.fullscreenElement) wrap.requestFullscreen();
    else document.exitFullscreen();
  });
  wrap.appendChild(fsBtn);

  if (cam.ptz) {
    const badge = document.createElement('div');
    badge.className = 'ptz-badge';  // CSS already places it at right:44px
    badge.textContent = 'PTZ';
    wrap.appendChild(badge);

    const reticle = document.createElement('div');
    reticle.className = 'reticle';
    wrap.appendChild(reticle);

    const overlay = document.createElement('div');
    overlay.className = 'ptz-overlay';
    overlay.title = 'Drag to steer · click to pan';
    overlay.addEventListener('mousedown', e => joystickStart(e, overlay, cam.id));
    overlay.addEventListener('wheel', e => handleScroll(e, overlay, vs, cam.id), { passive: false });
    overlay.addEventListener('contextmenu', e => e.preventDefault());
    wrap.appendChild(overlay);

    buildPresetBar(cam, wrap);
  }

  return wrap;
}

async function buildPresetBar(cam, wrap) {
  const presets = await fetch(`/presets/${cam.id}`).then(r => r.json()).catch(() => []);
  const first4  = presets.slice(0, 4);
  if (first4.length === 0 && cam.monitor_preset == null) return;

  const bar = document.createElement('div');
  bar.className = 'preset-bar';

  async function clickPreset(btn, camId, presetId) {
    btn.classList.remove('failed');
    try {
      const r = await fetch(`/preset/${camId}/${presetId}`, { method: 'POST' });
      const data = await r.json();
      if (!data.ok) {
        void btn.offsetWidth;
        btn.classList.add('failed');
        btn.addEventListener('animationend', () => btn.classList.remove('failed'), { once: true });
      }
    } catch {
      btn.classList.add('failed');
      btn.addEventListener('animationend', () => btn.classList.remove('failed'), { once: true });
    }
  }

  first4.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'preset-btn';
    btn.textContent = p.name;
    btn.title = `Go to preset: ${p.name}`;
    btn.addEventListener('click', e => { e.stopPropagation(); clickPreset(btn, cam.id, p.id); });
    bar.appendChild(btn);
  });

  if (cam.monitor_preset != null) {
    const btn = document.createElement('button');
    btn.className = 'preset-btn monitor';
    btn.textContent = 'Monitor';
    btn.title = 'Return to monitor position';
    btn.addEventListener('click', e => { e.stopPropagation(); clickPreset(btn, cam.id, cam.monitor_preset); });
    bar.appendChild(btn);
  }

  wrap.appendChild(bar);
}

// ── go2rtc health & stream monitoring ────────────────────────────────────────

let _lastAutoRestart = 0;

async function checkGo2rtcHealth() {
  const dot = document.getElementById('rtc-status');
  try {
    const h = await fetch('/api/go2rtc/health').then(r => r.json());
    if (h.alive && h.api_ok) {
      dot.className = 'ok';
      dot.title = `Stream engine running — ${h.streams.length} stream(s) registered`;
    } else {
      dot.className = 'err';
      const reason = !h.alive ? 'process not running' : 'API not responding';
      dot.title = `Stream engine offline (${reason}) — click to restart`;
      // Auto-restart with 60s cooldown so a persistently bad camera can't cause a restart storm
      const now = Date.now();
      if (now - _lastAutoRestart > 60000) {
        _lastAutoRestart = now;
        console.warn('[go2rtc] dead/unresponsive — auto-restarting');
        await fetch('/api/go2rtc/restart', { method: 'POST' }).catch(() => {});
        await new Promise(r => setTimeout(r, 2500));
        renderGrid();
        await checkGo2rtcHealth();
        return h;
      }
    }
    if (h.recent_errors && h.recent_errors.length) {
      console.warn('[go2rtc errors]', h.recent_errors.join('\n'));
    }
    if (h.log_tail && h.log_tail.length) {
      console.debug('[go2rtc log]', h.log_tail.join('\n'));
    }
    return h;
  } catch (e) {
    dot.className = '';
    dot.title = 'Stream engine status unknown';
    return null;
  }
}

async function reconnectStreams() {
  const dot = document.getElementById('rtc-status');
  dot.className = '';
  dot.title = 'Restarting…';
  try {
    await fetch('/api/go2rtc/restart', { method: 'POST' });
  } catch (e) { /* ignore */ }
  // Give go2rtc 2s to come back up then re-render to reconnect video-rtc elements
  await new Promise(r => setTimeout(r, 2500));
  renderGrid();
  await checkGo2rtcHealth();
}

function monitorCard(wrap, vs) {
  // Check every 5s for the lifetime of the card — show/hide offline overlay as stream comes and goes
  setInterval(() => {
    if (!wrap.isConnected) return;
    const video = vs.querySelector('video');
    const hasVideo = video && video.videoWidth > 0;
    const existing = wrap.querySelector('.stream-offline');
    if (hasVideo) {
      existing?.remove();
    } else if (!existing) {
      const div = document.createElement('div');
      div.className = 'stream-offline';
      div.innerHTML = '<span>⚠ Stream offline</span><button onclick="reconnectStreams()">Reconnect</button>';
      wrap.appendChild(div);
    }
  }, 5000);
}

// ── Init ─────────────────────────────────────────────────────────────────────

async function init() {
  await customElements.whenDefined('video-rtc');
  applyTheme(localStorage.getItem('theme') === 'light');
  fetch('/api/version').then(r => r.json()).then(d => {
    document.getElementById('app-version').textContent = `v${d.version}`;
  }).catch(() => {});
  const cameras = await (await fetch('/cameras')).json();
  const n = cameras.length;

  if (n > 0) go2rtcPort = cameras[0].go2rtc_port;
  document.getElementById('cam-count').textContent = `${n} camera${n !== 1 ? 's' : ''}`;

  // Build layout buttons
  const layoutContainer = document.getElementById('layout-btns');
  LAYOUTS.forEach(layout => {
    const btn = document.createElement('button');
    btn.textContent = layout.label;
    btn.dataset.layout = layout.label;
    btn.addEventListener('click', () => setLayout(layout));
    layoutContainer.appendChild(btn);
  });

  _cameras = cameras;
  _layout  = defaultLayout(n);

  document.querySelectorAll('#layout-btns button').forEach(b => {
    b.classList.toggle('active', b.dataset.layout === _layout.label);
  });

  renderGrid();
  await checkGo2rtcHealth();
  setInterval(checkGo2rtcHealth, 15000);
}

init().catch(console.error);
</script>
